<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TinVin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f4f6fb;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.14), transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.08), transparent 45%),
        linear-gradient(160deg, #0b0d13 0%, #141824 55%, #0c0e14 100%);
    }

    .glass-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 28px 24px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .title {
      text-align: center;
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 0.4px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 18px;
    }

    .tab-btn {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .form.active {
      display: flex;
    }

    .glass-input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s ease;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.52);
    }

    .glass-input:focus {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.09);
    }

    .glass-btn {
      margin-top: 4px;
      width: 100%;
      padding: 13px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .link-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.88rem;
      text-align: right;
      cursor: pointer;
      padding: 2px 0;
    }

    .link-btn:hover {
      color: #ffffff;
    }

    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.5;
      display: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .msg.show {
      display: block;
    }

    .session-box {
      display: none;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .session-box.active {
      display: flex;
    }

    .session-text {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      line-height: 1.6;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="title">TinVin</div>

    <div id="authSection">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="loginTab" onclick="switchView('login')">چوونەژوورەوە</button>
        <button type="button" class="tab-btn" id="signupTab" onclick="switchView('signup')">تۆمارکردن</button>
      </div>

      <!-- چوونەژوورەوە: ئیمەیڵ + پاسۆرد -->
      <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
        <input type="email" name="email" class="glass-input" placeholder="ئیمەیڵ" required />
        <input type="password" name="password" class="glass-input" placeholder="پاسۆرد" required />
        <button type="button" class="link-btn" onclick="switchView('forgot')">پاسۆردت بیرچووە؟</button>
        <button type="submit" class="glass-btn">چوونەژوورەوە</button>
      </form>

      <!-- تۆمارکردن: ناوی بەکارهێنەر + ئیمەیڵ + پاسۆرد -->
      <form id="signupForm" class="form" onsubmit="handleSignup(event)">
        <input type="text" name="username" class="glass-input" placeholder="ناوی بەکارهێنەر" required />
        <input type="email" name="email" class="glass-input" placeholder="ئیمەیڵ" required />
        <input type="password" name="password" class="glass-input" placeholder="پاسۆرد" minlength="6" required />
        <button type="submit" class="glass-btn">دروستکردنی هەژمار</button>
      </form>

      <!-- لەبیرچوونی پاسۆرد -->
      <form id="forgotForm" class="form" onsubmit="handleForgot(event)">
        <input type="email" name="email" class="glass-input" placeholder="ئیمەیڵی هەژمارەکەت بنووسە" required />
        <input type="password" name="newPassword" class="glass-input" placeholder="پاسۆردی نوێ" minlength="6" required />
        <button type="submit" class="glass-btn">نوێکردنەوەی پاسۆرد</button>
        <button type="button" class="link-btn" onclick="switchView('login')">گەڕانەوە بۆ چوونەژوورەوە</button>
      </form>
    </div>

    <div id="sessionBox" class="session-box">
      <div id="sessionInfo" class="session-text"></div>
      <button type="button" class="glass-btn" onclick="logout()">چوونەدەرەوە</button>
    </div>

    <div id="statusMsg" class="msg"></div>
  </div>

  <script>
    const USERS_KEY = "tinvin_local_users";
    const CURRENT_USER_KEY = "tinvin_current_user";

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const forgotForm = document.getElementById("forgotForm");
    const authSection = document.getElementById("authSection");
    const sessionBox = document.getElementById("sessionBox");
    const sessionInfo = document.getElementById("sessionInfo");
    const statusMsg = document.getElementById("statusMsg");

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function showMessage(text) {
      statusMsg.textContent = text;
      statusMsg.classList.add("show");
    }

    function clearMessage() {
      statusMsg.textContent = "";
      statusMsg.classList.remove("show");
    }

    function switchView(view) {
      clearMessage();
      loginForm.classList.remove("active");
      signupForm.classList.remove("active");
      forgotForm.classList.remove("active");
      loginTab.classList.remove("active");
      signupTab.classList.remove("active");

      if (view === "login") {
        loginForm.classList.add("active");
        loginTab.classList.add("active");
      } else if (view === "signup") {
        signupForm.classList.add("active");
        signupTab.classList.add("active");
      } else if (view === "forgot") {
        forgotForm.classList.add("active");
      }
    }

    function renderSession() {
      const raw = localStorage.getItem(CURRENT_USER_KEY);
      if (!raw) {
        authSection.style.display = "block";
        sessionBox.classList.remove("active");
        return;
      }

      try {
        const user = JSON.parse(raw);
        sessionInfo.innerHTML =
          "بەخێربێیت <strong>" + user.username + "</strong><br/>ئیمەیڵ: " + user.email;
        authSection.style.display = "none";
        sessionBox.classList.add("active");
      } catch {
        localStorage.removeItem(CURRENT_USER_KEY);
      }
    }

    function handleSignup(event) {
      event.preventDefault();
      clearMessage();

      const data = Object.fromEntries(new FormData(event.target).entries());
      const username = data.username.trim();
      const email = data.email.trim().toLowerCase();
      const password = data.password;

      const users = getUsers();
      if (users.some((u) => u.email === email)) {
        showMessage("ئەم ئیمەیڵە پێشتر تۆمار کراوە.");
        return;
      }

      const newUser = { username, email, password };
      users.push(newUser);
      saveUsers(users);
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(newUser));

      event.target.reset();
      showMessage("هەژمارەکەت بە سەرکەوتوویی دروست کرا.");
      renderSession();
    }

    function handleLogin(event) {
      event.preventDefault();
      clearMessage();

      const data = Object.fromEntries(new FormData(event.target).entries());
      const email = data.email.trim().toLowerCase();
      const password = data.password;

      const users = getUsers();
      const found = users.find((u) => u.email === email && u.password === password);

      if (!found) {
        showMessage("ئیمەیڵ یان پاسۆرد هەڵەیە.");
        return;
      }

      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(found));
      event.target.reset();
      showMessage("بە سەرکەوتوویی چوویتە ژوورەوە.");
      renderSession();
    }

    function handleForgot(event) {
      event.preventDefault();
      clearMessage();

      const data = Object.fromEntries(new FormData(event.target).entries());
      const email = data.email.trim().toLowerCase();
      const newPassword = data.newPassword;

      const users = getUsers();
      const index = users.findIndex((u) => u.email === email);

      if (index === -1) {
        showMessage("هیچ هەژمارێک بەم ئیمەیڵە نەدۆزرایەوە.");
        return;
      }

      users[index].password = newPassword;
      saveUsers(users);

      event.target.reset();
      showMessage("پاسۆردەکەت بە سەرکەوتوویی نوێ کرایەوە؛ ئێستا دەتوانیت بچیتە ژوورەوە.");
      switchView("login");
    }

    function logout() {
      localStorage.removeItem(CURRENT_USER_KEY);
      clearMessage();
      renderSession();
      switchView("login");
    }

    renderSession();
  </script>
</body>
</html>
