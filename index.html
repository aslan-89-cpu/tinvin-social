<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>TinVin Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#151c30;--line:#263049;--fg:#e8ecf5;--mut:#8f9ab3;--ac:#38bdf8;--up:#22c55e;--dn:#ef4444}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);font-family:Arial,sans-serif;padding-bottom:70px}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;border-bottom:1px solid var(--line);padding:13px 16px;font-weight:800;font-size:19px}
header span{color:var(--ac)}
.wrap{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#0e1427;color:var(--fg);border:1px solid var(--line);border-radius:10px;outline:none}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#04121f;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.ic{background:none;border:0;color:var(--fg);font-size:15px;padding:6px 8px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mut{color:var(--mut);font-size:12px}.err{color:#f87171;font-size:13px;min-height:18px}
.u{cursor:pointer}
.post img{width:100%;border-radius:10px;margin:8px 0;display:block}
.post p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.cm div{margin:5px 0}.cm b{margin-right:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,16,32,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;padding:14px;background:none;border:0;color:var(--mut);font-weight:700}nav .on{color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.stats{display:flex;justify-content:space-around;text-align:center;margin:12px 0}.stats b{display:block;font-size:18px}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px}
.sheet button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 4px}
.sheet .d{color:#f87171}
.glass{background:linear-gradient(145deg,rgba(80,110,255,.16),rgba(150,80,255,.10));border:1px solid rgba(140,170,255,.22);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(40,60,200,.18),inset 0 1px 0 rgba(255,255,255,.08);padding:6px 14px;margin-bottom:14px}
.glass h4{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid rgba(140,170,255,.12);color:var(--fg);padding:14px 2px;text-align:start;font-size:15px}
.si{display:flex;color:var(--ac)}.sl{flex:1}.ch{color:var(--mut);font-size:20px}
.srow.d,.srow.d .si{color:#f87171}
.pill{font-size:11px;background:rgba(167,139,250,.25);color:#c4b5fd;border-radius:99px;padding:2px 8px}

.ava{width:64px;height:64px;border-radius:50%;margin:10px auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#06101f;box-shadow:0 0 24px rgba(120,140,255,.5)}
html{background:#0b1020;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 480px at 15% -8%,rgba(110,80,255,.35),transparent 70%),radial-gradient(700px 480px at 100% 12%,rgba(56,189,248,.20),transparent 70%),radial-gradient(600px 400px at 50% 110%,rgba(167,139,250,.22),transparent 70%),#0b1020}

.bd{position:absolute;top:6px;right:14%;background:#ef4444;color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}

.str{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}

.sr>div{width:100%;height:100%;border-radius:50%;background:#0e1427;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--fg)}

.sb{display:flex;gap:4px;padding:10px 10px 0}.sb span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25)}.sb span.on{background:#fff}

/* THEME v2 - deep space glass */
:root{--bg:#070a1f;--card:#101733;--line:#26335f;--mut:#93a0c8;--ac:#56c6f0}

header{background:rgba(7,10,31,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(140,180,255,.22)}

.pbtns{gap:8px}.pbtns .btn{flex:1 1 0;min-width:0;padding:12px 4px;white-space:nowrap;text-align:center}

.cl{position:fixed;inset:0;z-index:80;background:radial-gradient(700px 460px at 12% -6%,rgba(120,80,255,.4),transparent 70%),radial-gradient(640px 460px at 105% 90%,rgba(34,211,238,.25),transparent 70%),#070a1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.cb{padding:16px 24px;border-radius:99px;border:1px solid rgba(140,180,255,.4);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:700}
.cb.ok{background:#16a34a;border-color:#16a34a}.cb.no{background:#dc2626;border-color:#dc2626}
.avw{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#06101f;flex:0 0 auto}
.avw img{width:100%;height:100%;object-fit:cover;display:block}
.sr .avw{width:100%!important;height:100%!important;border:2px solid #0b1020;font-size:20px!important}
.camb{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;border:2px solid #0b1020;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#06101f;display:flex;align-items:center;justify-content:center;padding:0}
.ftabs{display:flex;gap:20px;padding:0 4px 10px}
.ftabs button{background:none;border:0;color:var(--mut);font-weight:700;font-size:14px;padding:6px 0;border-bottom:2px solid transparent}
.ftabs .on{color:#fff;border-color:#7aa7ff}
.btn.sm{padding:8px 14px;font-size:13px}
.chh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mrow{display:flex;align-items:flex-end;gap:6px}.mrow.me{justify-content:flex-end}
.tsep{align-self:center;color:var(--mut);font-size:11px;margin:10px 0 4px}
.seen{align-self:flex-end;color:var(--mut);font-size:11px;margin:-2px 6px 4px 0}
.mimg{display:block;max-width:230px;max-height:300px;border-radius:14px}
.bub.pic{padding:3px;background:transparent!important}
.bub.me{background:linear-gradient(135deg,#8b5cf6,#4f8cff);color:#fff}
.cpill{display:flex;align-items:center;gap:4px;flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(140,180,255,.28);border-radius:99px;padding:3px 8px 3px 16px}
.cpill input{background:transparent!important;border:0!important;box-shadow:none!important;margin:0;padding:10px 4px}
.cpill .ic{color:var(--fg);display:flex;padding:6px}
.cs{color:#7aa7ff!important}
.cl .rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cl .lv{position:absolute;right:16px;top:70px;width:104px;height:140px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.5);z-index:3;transform:scaleX(-1)}
.cl .ci{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px}
.cl .cbtns{position:relative;z-index:2}

.cl.vid .ci .avw{display:none}
.cl.vid .cbtns{position:absolute;bottom:60px}
.cl .cbtns{flex-wrap:wrap;justify-content:center;padding:0 12px}
.cb{padding:14px 18px}
.gold{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;background:linear-gradient(90deg,#fde68a,#f5b301 50%,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(245,179,1,.45))}
.goldcard{border-color:rgba(245,179,1,.65)!important;box-shadow:0 0 26px rgba(245,179,1,.25),inset 0 1px 0 rgba(255,255,255,.08)!important}

.crop canvas{border-radius:50%;touch-action:none;box-shadow:0 0 0 3px rgba(140,180,255,.7),0 0 40px rgba(120,100,255,.45)}

</style>

<body>
<header class="row"><div>TinVin <span>Social</span></div><span class="sp"></span><button class="ic hidden" id="gear" aria-label="Settings" style="font-size:22px">&#9881;</button></header>
<div class="wrap">

<div id="auth" class="card hidden">
  <h2 id="aT">Welcome back</h2>
  <input id="aE" type="email" placeholder="Email" autocomplete="email">
  <input id="aU" placeholder="Username (letters, numbers, _)" class="hidden">
  <div style="position:relative"><input id="aP" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" style="padding-right:46px"><button type="button" class="ic" id="aEye" aria-label="Show password" style="position:absolute;right:4px;top:9px;color:var(--mut);display:flex;line-height:0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></div>
  <button class="btn" id="aB" style="width:100%">Login</button>
  <div class="err" id="aM"></div>
  <p class="mut" style="text-align:center"><span id="aF" style="color:var(--ac);cursor:pointer">Forgot password?</span></p>
  <p class="mut" style="text-align:center"><span id="aS" style="color:var(--ac);cursor:pointer">Create account</span></p>
</div>

<div id="app" class="hidden"><div id="view"></div></div>
</div>

<nav id="nav" class="hidden">
  <button data-v="home" class="on"><span>Home</span></button>
  <button data-v="search"><span>Search</span></button>
  <button data-v="create" class="orb" aria-label="Create">+</button>
  <button data-v="chats"><span>Chats</span><i id="cb" class="bd hidden"></i></button>
  <button data-v="me"><span>Profile</span></button>
</nav>
<div id="sheet" class="sheet hidden"></div>

<script>
"use strict";
const API="https://tinvin-social-api.aslan89aslan1.workers.dev";
let token=localStorage.getItem("tvs_token")||"",me=null,mode="login",tab=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEAL_D="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91C2.88 9.33 2 10.57 2 12s.88 2.67 2.19 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z";
const vb=v=>v?` <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle"><path fill="${v==2?"#f5b301":"#1d9bf0"}" d="${SEAL_D}"/><path fill="#fff" d="M9.5 16.5l-3.5-3.5 1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></svg>`:"";
const nm=(u,v)=>`<span class="${v==2?"gold":""}">@${esc(u)}</span>${vb(v)}`;
const ago=t=>{const s=Math.floor(Date.now()/1000)-t;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};

async function api(path,opt={}){
  const h={...(opt.headers||{})};
  if(!(opt.raw))h["Content-Type"]="application/json";
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...opt,headers:h});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token){logout(true)}throw new Error(d.error||"Request failed.")}
  return d;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

/* DIALOGS */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
window.alert=m=>toast(m);
function sure(msg,ok="Yes"){
  return new Promise(res=>{
    const s=$("sheet");s.classList.remove("hidden");
    s.innerHTML=`<div><p style="margin:6px 0 10px">${esc(msg)}</p><button class="btn" id="dY">${esc(ok)}</button><button id="dN">Cancel</button></div>`;
    const done=v=>{s.classList.add("hidden");res(v)};
    s.onclick=e=>{if(e.target===s)done(false)};
    $("dY").onclick=()=>done(true);$("dN").onclick=()=>done(false);
  });
}
function ask(msg,val=""){
  return new Promise(res=>{
    const s=$("sheet");s.classList.remove("hidden");
    s.innerHTML=`<div><p style="margin:6px 0">${esc(msg)}</p><input id="dI" value="${esc(val)}" autocomplete="off"><button class="btn" id="dY">Save</button><button id="dN">Cancel</button></div>`;
    const done=v=>{s.classList.add("hidden");res(v)};
    s.onclick=e=>{if(e.target===s)done(null)};
    $("dY").onclick=()=>done($("dI").value);$("dN").onclick=()=>done(null);
    setTimeout(()=>$("dI").focus(),60);
  });
}

/* SHARE */
const SITE_URL=()=>location.origin.replace(/^http:/,"https:")+location.pathname;
async function copyText(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch{}
  try{
    const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");
    a.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(a);
    a.focus();a.select();a.setSelectionRange(0,t.length);
    const ok=document.execCommand("copy");a.remove();return ok;
  }catch{return false}
}
function showLink(url){
  const s=$("sheet");s.classList.remove("hidden");
  s.innerHTML=`<div><p style="margin:6px 0">Copy this link</p><input id="lk" readonly value="${esc(url)}"><button id="lc">Close</button></div>`;
  s.onclick=e=>{if(e.target===s)s.classList.add("hidden")};
  $("lc").onclick=()=>s.classList.add("hidden");
  setTimeout(()=>{const i=$("lk");i.focus();i.select();i.setSelectionRange(0,url.length)},60);
}
async function shareIt(text,url){
  try{if(navigator.share){await navigator.share({title:"TinVin Social",text,url});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  if(await copyText(url)){alert("Link copied");return}

const IC2={phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',back:'<path d="M15 5l-7 7 7 7"/>'};

function shrink(file,max=1280){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>res(b||file),"image/jpeg",.85);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);res(file)};
    im.src=u;
  });
}

}
function cropAvatar(file){
  const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(url);alert("Can't open this photo.")};
  im.onload=()=>{
    const iw=im.naturalWidth,ih=im.naturalHeight,D=Math.min(320,Math.floor(innerWidth*.82));
    let z=1,rot=0,ox=0,oy=0;
    const o=document.createElement("div");o.className="crop";
    o.innerHTML=`<b style="font-size:18px">Move and zoom</b><canvas id="cvA" width="${D}" height="${D}"></canvas>
      <div class="row" style="width:${D}px;gap:10px"><span class="mut">&minus;</span><input id="czm" type="range" min="1" max="4" step="0.01" value="1" style="margin:0"><span class="mut">+</span><button class="btn ghost sm" id="crt">Rotate</button></div>
      <div class="row" style="width:${D}px;gap:12px"><button class="btn ghost sp" id="ccx">Cancel</button><button class="btn sp" id="csv">Save</button></div>`;
    document.body.appendChild(o);
    const cv=$("cvA"),sl=$("czm"),ew=()=>rot%2?ih:iw,eh=()=>rot%2?iw:ih,minS=()=>D/Math.min(ew(),eh());
    const clampZ=v=>Math.max(1,Math.min(4,v));
    const clamp=()=>{const sc=minS()*z,mx=Math.max(0,(ew()*sc-D)/2),my=Math.max(0,(eh()*sc-D)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))};
    const paint=(c,size)=>{const k=size/D,sc=minS()*z*k,g=c.getContext("2d");g.fillStyle="#000";g.fillRect(0,0,size,size);g.save();g.translate(size/2+ox*k,size/2+oy*k);g.rotate(rot*Math.PI/2);g.scale(sc,sc);g.drawImage(im,-iw/2,-ih/2);g.restore()};
    const redraw=()=>{clamp();paint(cv,D)};
    const pts=new Map();let lastD=0;
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);lastD=0};
    cv.onpointermove=e=>{
      if(!pts.has(e.pointerId))return;
      const p=pts.get(e.pointerId);
      if(pts.size===1){ox+=e.clientX-p[0];oy+=e.clientY-p[1]}
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastD)z=clampZ(z*d/lastD);lastD=d;sl.value=z}
      redraw();
    };
    cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);lastD=0};
    cv.onwheel=e=>{e.preventDefault();z=clampZ(z*(e.deltaY<0?1.08:.92));sl.value=z;redraw()};
    sl.oninput=()=>{z=+sl.value;redraw()};
    $("crt").onclick=()=>{rot=(rot+1)%4;ox=0;oy=0;redraw()};
    const close=()=>{URL.revokeObjectURL(url);o.remove()};
    $("ccx").onclick=close;
    $("csv").onclick=async()=>{
      $("csv").disabled=true;
      try{
        const out=document.createElement("canvas");out.width=out.height=512;paint(out,512);
        const b=await new Promise(r=>out.toBlob(r,"image/jpeg",.9));
        const key=(await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":"image/jpeg"},body:b})).key;
        await post("/api/me",{avatar:key});me.avatar_key=key;close();profile(me.username);
      }catch(e){alert(e.message);$("csv").disabled=false}
    };
    redraw();
  };
  im.src=url;
}

let rec=null,call=null,sigLast=0,sigT=null;
const VC=new Map();
function voiceEl(key){

  let u=VC.get(key);
  if(!u){u=fetch(API+"/img/"+key).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b));VC.set(key,u)}
  u.then(url=>{a.src=url}).catch(()=>{a.src=API+"/img/"+key});

async function toggleRec(id,afterSend){
  const b=$("mR");
  if(rec){rec.send=true;rec.mr.stop();return}
  if(!window.isSecureContext||!navigator.mediaDevices||!window.MediaRecorder){alert("Voice needs a secure (HTTPS) connection.");return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch{alert("Microphone permission denied.");return}
  const mt=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  let mr;try{mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:48000}:{})}catch{mr=new MediaRecorder(st)}
  const ch=[],t0=Date.now();
  rec={mr,send:false};b.classList.add("rec");
  const tick=setInterval(()=>{const n=Math.floor((Date.now()-t0)/1000);b.textContent="\u25A0 "+n+"s";if(n>=120&&rec){rec.send=true;mr.stop()}},400);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onstop=async()=>{
    clearInterval(tick);st.getTracks().forEach(t=>t.stop());
    const bb=$("mR");if(bb){bb.classList.remove("rec");bb.innerHTML=ic2("mic")}
    const send=rec&&rec.send;rec=null;
    if(!send||!ch.length)return;
    const blob=new Blob(ch,{type:mr.mimeType||mt||"audio/webm"});
    if(Date.now()-t0<800||blob.size<800){alert("Too short");return}
    try{
      const key=(await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":blob.type},body:blob})).key;
      await post("/api/message/"+id,{audio:key});afterSend();
    }catch(e){alert(e.message)}
  };
  mr.start(1000);
}

const ICE_FB=[{urls:["stun:stun.cloudflare.com:3478","stun:stun.l.google.com:19302"]}];
const rid=()=>Math.random().toString(36).slice(2,10);
const sendSig=(to,kind,data,cid,v)=>post("/api/signal/"+to,{kind,data:JSON.stringify({c:cid,d:data==null?null:data,v:v?1:0})});
function qSig(c,kind,data){const p=(c.q||Promise.resolve()).then(()=>sendSig(c.peer,kind,data,c.cid,c.video));c.q=p.catch(()=>{});return p}
const fmtT=()=>{const n=Math.floor((Date.now()-call.t0)/1000);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
function callUI(){
  if(!call)return;
  let v=$("clv");
  if(!v){
    v=document.createElement("div");v.id="clv";v.className="cl";
    v.innerHTML=`<video id="rVid" class="rv hidden" autoplay playsinline></video><video id="lVid" class="lv hidden" autoplay playsinline muted></video><div class="ci" id="clI"></div><div class="cbtns row" id="clB" style="gap:14px;margin-top:34px"></div>`;
    document.body.appendChild(v);
  }
  const c=call;
  v.classList.toggle("vid",!!(c.video&&c.connected));
  $("rVid").classList.toggle("hidden",!c.video);
  const lv=$("lVid");
  if(c.video&&c.stream){lv.classList.remove("hidden");if(lv.srcObject!==c.stream)lv.srcObject=c.stream}
  $("clI").innerHTML=`${av(c.name,c.av,96)}<b style="font-size:22px">@${esc(c.name)}</b><div class="mut" id="clS" style="font-size:16px">${esc(c.status||"")}</div>`;
  $("clB").innerHTML=c.ringing?`<button class="cb ok" id="clA">Accept</button><button class="cb no" id="clD">Decline</button>`:`<button class="cb" id="clM">${c.muted?"Unmute":"Mute"}</button><button class="cb" id="clR">${c.ear?"Speaker":"Earpiece"}</button>${c.video?`<button class="cb" id="clC">${c.camOff?"Camera on":"Camera off"}</button>`:""}<button class="cb no" id="clD">End</button>`;
  $("clD").onclick=()=>endCall(true);
  if(c.ringing)$("clA").onclick=acceptCall;
  else{
    $("clM").onclick=()=>{c.muted=!c.muted;c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted);callUI()};
    $("clR").onclick=pickRoute;
    const cc=$("clC");if(cc)cc.onclick=()=>{c.camOff=!c.camOff;c.stream.getVideoTracks().forEach(t=>t.enabled=!c.camOff);callUI()};
  }
}
async function makePC(){
  const c=call;let ice=ICE_FB;
  try{const r=await api("/api/turn");ice=r.iceServers||ICE_FB;c.relay=!!r.relay}catch{}
  const pc=new RTCPeerConnection({iceServers:ice});c.pc=pc;
  c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
  pc.onicecandidate=e=>{if(e.candidate)qSig(c,"ice",e.candidate.toJSON()).catch(()=>{})};
  pc.ontrack=e=>{
    if(c.video){const rv=$("rVid");if(rv){rv.srcObject=e.streams[0];rv.play().catch(()=>{})}}
    else{let a=$("rAud");if(!a){a=document.createElement("audio");a.id="rAud";a.autoplay=true;a.setAttribute("playsinline","");document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})}
  };
  pc.oniceconnectionstatechange=()=>{
    if(call!==c||c.connected)return;
    c.status=(c.role==="caller"?"Calling":"Connecting")+" ("+pc.iceConnectionState+")";
    const el=$("clS");if(el)el.textContent=c.status;
  };
  pc.onconnectionstatechange=()=>{
    if(call!==c)return;
    if(pc.connectionState==="connected"&&!c.connected){
      c.connected=true;c.t0=Date.now();clearTimeout(c.to);c.status="00:00";callUI();
      c.tick=setInterval(()=>{const el=$("clS");if(el&&call===c){c.status=fmtT();el.textContent=c.status}},1000);
    }
    if(pc.connectionState==="failed"){
      alert("Call failed."+(c.relay?"":" No relay server is set up, so some networks cannot connect."));
      endCall(true);
    }
  };
}
async function pickRoute(){
  const c=call;if(!c)return;
  const el=c.video?$("rVid"):$("rAud");
  if(!el||!el.setSinkId){alert("This browser (iPhone Safari) does not let websites switch between earpiece and speaker. Headphones/AirPods switch automatically.");return}
  try{
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="audiooutput");
    const want=c.ear?/speaker/i:/ear|receiver|handset/i;
    const d=devs.find(x=>want.test(x.label));
    if(!d){alert("This phone has no separate earpiece/speaker option for websites.");return}
    await el.setSinkId(d.deviceId);c.ear=!c.ear;callUI();
  }catch(e){alert(e.message)}
}
async function startCall(id,name,avk,video){
  if(call)return;
  if(!window.isSecureContext||!navigator.mediaDevices||!window.RTCPeerConnection){alert("Calls need a secure (HTTPS) connection.");return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:"user"}:false})}catch{alert(video?"Camera or microphone permission denied.":"Microphone permission denied.");return}
  const c=call={peer:id,name,av:avk,video:!!video,stream:st,role:"caller",cid:rid(),pend:[],status:video?"Video calling...":"Calling..."};callUI();
  try{
    await makePC();
    const off=await c.pc.createOffer();
    const sent=qSig(c,"offer",{type:off.type,sdp:off.sdp});
    await c.pc.setLocalDescription(off);
    await sent;
  }catch(e){alert(e.message);endCall(false);return}
  c.to=setTimeout(()=>{if(call===c&&!c.connected){alert("No answer.");endCall(true)}},45000);
}
async function acceptCall(){
  const c=call;if(!c||!c.ringing)return;
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true,video:c.video?{facingMode:"user"}:false})}catch{alert("Camera or microphone permission denied.");endCall(true);return}
  clearTimeout(c.to);c.ringing=false;c.stream=st;c.status="Connecting...";callUI();
  try{
    await makePC();
    await c.pc.setRemoteDescription(c.offer);
    for(const x of c.pend)await c.pc.addIceCandidate(x).catch(()=>{});
    c.pend=[];
    const ans=await c.pc.createAnswer();
    const sent=qSig(c,"answer",{type:ans.type,sdp:ans.sdp});
    await c.pc.setLocalDescription(ans);
    await sent;
  }catch(e){alert(e.message);endCall(true)}
}
function endCall(notify){
  if(!call)return;
  const c=call;call=null;
  clearTimeout(c.to);clearInterval(c.tick);
  if(notify)qSig(c,"end").catch(()=>{});
  try{c.pc&&c.pc.close()}catch{}
  if(c.stream)c.stream.getTracks().forEach(t=>t.stop());
  const a=$("rAud");if(a)a.remove();
  const v=$("clv");if(v)v.remove();
}
async function onSignal(x){
  let m={};try{m=x.data?JSON.parse(x.data):{}}catch{}
  const d=m.d;
  if(x.kind==="offer"){
    if(x.age>40)return;
    if(call){sendSig(x.from_id,"end",null,m.c).catch(()=>{});return}
    const c=call={peer:x.from_id,name:x.username,av:x.av,video:!!m.v,role:"callee",cid:m.c,pend:[],offer:d,ringing:true,status:m.v?"Incoming video call":"Incoming voice call"};
    callUI();
    c.to=setTimeout(()=>{if(call===c&&c.ringing)endCall(false)},50000);
    return;
  }
  if(!call||call.peer!==x.from_id||call.cid!==m.c)return;
  if(x.kind==="answer"&&call.pc){
    try{await call.pc.setRemoteDescription(d)}catch(e){alert("Call error: "+e.message);endCall(true);return}
    for(const c of call.pend)await call.pc.addIceCandidate(c).catch(()=>{});
    call.pend=[];
  }else if(x.kind==="ice"){
    if(call.pc&&call.pc.remoteDescription)await call.pc.addIceCandidate(d).catch(()=>{});
    else call.pend.push(d);
  }else if(x.kind==="end"){alert("Call ended");endCall(false)}
}
async function pollSignals(){
  if(document.visibilityState!=="visible"||pollSignals.busy)return;
  pollSignals.busy=true;
  try{
    const r=(await api("/api/signals?after="+sigLast)).signals;
    for(const x of r){sigLast=Math.max(sigLast,x.id);await onSignal(x)}
  }catch{}
  pollSignals.busy=false;
}

kmr:["Peyam","Mal","Lêgerîn","Profîl","Mîheng","Hesab","Ewlehî","Der barê","Navê biguhere","E-nameyê biguhere","Şîfreyê biguhere","Ziman","Piştrastkirina du-gavî","Ji hemû amûran derkeve","Hesabên astengkirî","Siyaseta nepenîtiyê","Mercên bikaranînê û rêzikên civakê","Derkeve","Hesabê jê bibe","Tomar bike","Zû","Şîfreya heyî","Şîfreya nû (8+ tîp)","E-nameya nû","Şîfre","Astengiyê rake","Tu hesabê astengkirî tune."],
fa:["گفتگوها","خانه","جستجو","پروفایل","تنظیمات","حساب","امنیت","درباره","تغییر نام","تغییر ایمیل","تغییر رمز عبور","زبان","تأیید دو مرحله‌ای","خروج از همه دستگاه‌ها","حساب‌های مسدود","سیاست حفظ حریم خصوصی","شرایط و قوانین جامعه","خروج","حذف حساب","ذخیره","به‌زودی","رمز عبور فعلی","رمز عبور جدید (حداقل ۸ نویسه)","ایمیل جدید","رمز عبور","رفع مسدودیت","حساب مسدودی وجود ندارد."],
tr:["Sohbetler","Ana sayfa","Ara","Profil","Ayarlar","Hesap","Güvenlik","Hakkında","Adı değiştir","E-postayı değiştir","Şifreyi değiştir","Dil","İki adımlı doğrulama","Tüm cihazlardan çık","Engellenen hesaplar","Gizlilik politikası","Şartlar ve topluluk kuralları","Çıkış yap","Hesabı sil","Kaydet","Yakında","Mevcut şifre","Yeni şifre (8+ karakter)","Yeni e-posta","Şifre","Engeli kaldır","Engellenen hesap yok."],
de:["Chats","Start","Suche","Profil","Einstellungen","Konto","Sicherheit","Info","Namen ändern","E-Mail ändern","Passwort ändern","Sprache","Zwei-Faktor-Authentifizierung","Auf allen Geräten abmelden","Blockierte Konten","Datenschutzerklärung","Nutzungsbedingungen und Community-Regeln","Abmelden","Konto löschen","Speichern","Bald","Aktuelles Passwort","Neues Passwort (mind. 8 Zeichen)","Neue E-Mail","Passwort","Entsperren","Keine blockierten Konten."],
fr:["Discussions","Accueil","Rechercher","Profil","Paramètres","Compte","Sécurité","À propos","Changer le nom","Changer l'e-mail","Changer le mot de passe","Langue","Authentification à deux facteurs","Se déconnecter de tous les appareils","Comptes bloqués","Politique de confidentialité","Conditions et règles de la communauté","Se déconnecter","Supprimer le compte","Enregistrer","Bientôt","Mot de passe actuel","Nouveau mot de passe (8+ caractères)","Nouvel e-mail","Mot de passe","Débloquer","Aucun compte bloqué."],
es:["Chats","Inicio","Buscar","Perfil","Ajustes","Cuenta","Seguridad","Acerca de","Cambiar nombre","Cambiar correo","Cambiar contraseña","Idioma","Autenticación en dos pasos","Cerrar sesión en todos los dispositivos","Cuentas bloqueadas","Política de privacidad","Términos y normas de la comunidad","Cerrar sesión","Eliminar cuenta","Guardar","Pronto","Contraseña actual","Nueva contraseña (8+ caracteres)","Nuevo correo","Contraseña","Desbloquear","No hay cuentas bloqueadas."]
};
for(const k in ADD)I[k]=Object.fromEntries(KEYS.map((key,i)=>[key,ADD[k][i]]));
const T=k=>(I[lang]&&I[lang][k])||k;
function applyLang(){
  const n={home:"Home",search:"Search",chats:"Chats",me:"Profile"};
  document.querySelectorAll("nav button").forEach(b=>{const sp=b.querySelector("span");if(sp)sp.textContent=T(n[b.dataset.v])});
}

/* SETTINGS */
const IC={user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',devices:'<rect x="3" y="4" width="14" height="10" rx="2"/><path d="M8 18h4M7 21h6"/>',block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const R=(id,ic,label,extra="",cls="")=>`<button class="srow ${cls}" id="${id}"><span class="si">${ico(ic)}</span><span class="sl">${T(label)}</span>${extra}<span class="ch">&rsaquo;</span></button>`;
const LK=(href,label)=>`<a class="srow" href="${href}" style="text-decoration:none"><span class="si">${ico("doc")}</span><span class="sl">${T(label)}</span><span class="ch">&rsaquo;</span></a>`;
function settings(){
  const dir=RTL.includes(lang)?"rtl":"ltr";
  $("view").innerHTML=`<div dir="${dir}">
  <div class="glass" style="text-align:center"><div style="display:flex;justify-content:center;margin:10px 0 6px">${av(me.username,me.avatar_key,72)}</div>
    <b style="font-size:18px">${nm(me.username,me.verified)}</b><p class="mut" style="margin:4px 0 12px">${esc(me.email)}</p></div>
  <div class="glass"><h4>${T("Account")}</h4>
    ${R("sN","user","Change name")}
    ${R("sE","mail","Change email")}
    <div id="pE" class="spanel hidden"><input id="eN" type="email" placeholder="${T("New email")}" autocomplete="email"><input id="eP" type="password" placeholder="${T("Password")}" autocomplete="current-password"><button class="btn" id="eS">${T("Save")}</button><div class="err" id="eM"></div></div>
    ${R("sP","lock","Change password")}
    <div id="pf" class="spanel hidden"><input id="pC" type="password" placeholder="${T("Current password")}" autocomplete="current-password"><input id="pN" type="password" placeholder="${T("New password (8+ characters)")}" autocomplete="new-password"><button class="btn" id="pS">${T("Save")}</button><div class="err" id="pM2"></div></div>
    ${R("sL","globe","Language")}
    <div id="pL" class="spanel hidden">${Object.entries(LANGS).map(([k,v])=>`<button class="btn ${k===lang?"":"ghost"}" data-lg="${k}" style="margin:3px">${v}</button>`).join("")}</div>
  </div>
  <div class="glass"><h4>${T("Security")}</h4>
    ${R("s2","shield","Two-factor authentication",`<span class="pill">${T("Soon")}</span>`)}
    ${R("sA","devices","Log out of all devices")}
    ${R("sK","block","Blocked accounts")}
    <div id="pK" class="spanel hidden"><div id="bl" class="mut">...</div></div>
  </div>
  <div class="glass"><h4>${T("About")}</h4>${LK("privacy.html","Privacy policy")}${LK("terms.html","Terms and community rules")}</div>
  <div class="glass">${R("lo","out","Logout")}${R("del","trash","Delete account","","d")}</div></div>`;
  const tg=(b,p)=>{$(b).onclick=()=>$(p).classList.toggle("hidden")};
  tg("sE","pE");tg("sP","pf");tg("sL","pL");
  $("sN").onclick=async()=>{const n=await ask("New username (3-20 letters, numbers, _)",me.username);if(n===null||n.trim()===me.username)return;try{await post("/api/me",{username:n});me.username=n.trim();settings()}catch(e){alert(e.message)}};
  $("eS").onclick=async()=>{const m=$("eM");m.style.color="";m.textContent="";try{const r=await post("/api/email",{email:$("eN").value,password:$("eP").value});me.email=r.email;settings()}catch(e){m.textContent=e.message}};
  $("pS").onclick=async()=>{const m=$("pM2");m.style.color="";m.textContent="";try{await post("/api/password",{current:$("pC").value,password:$("pN").value});m.style.color="#22c55e";m.textContent="OK";$("pC").value="";$("pN").value=""}catch(e){m.textContent=e.message}};
  document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{lang=b.dataset.lg;localStorage.setItem("tvs_lang",lang);applyLang();settings()});
  $("s2").onclick=()=>alert("Two-factor authentication is coming soon.");
  $("sA").onclick=async()=>{if(!await sure("Log out of all devices, including this one?","Log out"))return;try{await post("/api/logout-all");logout(true)}catch(e){alert(e.message)}};
  const loadBlocks=async()=>{const box=$("bl");
    try{const l=(await api("/api/blocks")).users;
      if(!l.length){box.textContent=T("No blocked accounts.");return}
      box.innerHTML="";
      l.forEach(u=>{const r=document.createElement("div");r.className="row";r.style.padding="6px 0";
        r.innerHTML=`<b style="color:var(--fg)">@${esc(u.username)}</b><span class="sp"></span><button class="btn ghost">${T("Unblock")}</button>`;
        r.querySelector("button").onclick=async()=>{try{await post("/api/unblock/"+u.id);loadBlocks()}catch(e){alert(e.message)}};
        box.appendChild(r)});
    }catch(e){box.textContent=e.message}};
  $("sK").onclick=()=>{$("pK").classList.toggle("hidden");loadBlocks()};
  $("lo").onclick=()=>logout();
  $("del").onclick=async()=>{
    if(!await sure("Delete your account and all your content? This can't be undone.","Delete account"))return;
    try{await api("/api/me",{method:"DELETE"});logout(true)}catch(e){alert(e.message)}
  };
}

applyLang();
const rt=(location.hash.match(/^#reset=(r_[a-f0-9]+)/)||[])[1];
if(rt){logout(true);resetMode(rt)}else token?start():logout(true);
</script>
</body>
