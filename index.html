<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070916">
<title>TinVin Social</title>
<style>
:root{
  --bg:#070916;
  --glass:linear-gradient(150deg,rgba(255,255,255,0.14) 0%,rgba(168,85,247,0.08) 50%,rgba(56,189,248,0.09) 100%);
  --glass-hi:linear-gradient(150deg,rgba(255,255,255,0.20) 0%,rgba(217,70,239,0.12) 55%,rgba(56,189,248,0.14) 100%);
  --line:rgba(255,255,255,0.22);
  --line-soft:rgba(255,255,255,0.12);
  --fg:#f8fafc;
  --mut:#cbd5e1;
  --ac:#e879f9;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#c026d3 55%,#ec4899 100%);
  --grad-cool:linear-gradient(135deg,#22d3ee 0%,#818cf8 45%,#d946ef 100%);
  --up:#22c55e;
  --dn:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 8%,rgba(139,92,246,0.36),transparent 42%),
    radial-gradient(circle at 88% 18%,rgba(34,211,238,0.22),transparent 45%),
    radial-gradient(circle at 72% 88%,rgba(217,70,239,0.30),transparent 48%),
    var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:96px;
  min-height:100vh;
  overflow-x:hidden;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(70px);
}
body::before{
  width:270px;height:270px;top:-60px;left:-60px;
  background:radial-gradient(circle,rgba(168,85,247,0.52),transparent 70%);
}
body::after{
  width:310px;height:310px;bottom:50px;right:-60px;
  background:radial-gradient(circle,rgba(79,70,229,0.45),transparent 70%);
}
button,input,textarea{font:inherit}
button{cursor:pointer;transition:all .2s ease}
button:active{transform:scale(0.97)}
.hidden{display:none!important}

header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(13,16,38,0.72));
  backdrop-filter:blur(28px) saturate(175%);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,0.08),0 10px 30px rgba(0,0,0,0.38);
  padding:12px 16px;font-weight:800;font-size:20px;
  display:flex;align-items:center;gap:10px;letter-spacing:-0.3px;
}
.logo-mark{
  width:34px;height:34px;border-radius:11px;
  background:linear-gradient(145deg,rgba(255,255,255,0.18),rgba(139,92,246,0.22));
  border:1px solid rgba(255,255,255,0.26);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.45),0 0 20px rgba(168,85,247,0.55);
}
header span.brand-sub{
  background:linear-gradient(90deg,#e879f9,#c084fc,#67e8f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.wrap{max-width:540px;margin:auto;padding:14px}
.card{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(175%);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
  border:1px solid var(--line);
  border-radius:24px;padding:15px;margin-bottom:14px;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.28),
    inset 0 -10px 24px rgba(168,85,247,0.08),
    0 14px 36px rgba(0,0,0,0.45);
}
input,textarea{
  width:100%;padding:12px 14px;margin:6px 0;
  background:linear-gradient(145deg,rgba(255,255,255,0.09),rgba(10,14,32,0.58));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--fg);border:1px solid var(--line-soft);border-radius:15px;outline:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.14);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
input:focus,textarea:focus{
  background:linear-gradient(145deg,rgba(255,255,255,0.14),rgba(18,22,48,0.68));
  border-color:rgba(232,121,249,0.75);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.25),0 0 0 3px rgba(168,85,247,0.22);
}
textarea{min-height:76px;resize:vertical}
input[type="file"]{padding:8px 10px;font-size:12px;color:var(--mut)}
input[type="file"]::file-selector-button{
  background:rgba(255,255,255,0.14);color:#fff;
  border:1px solid rgba(255,255,255,0.24);border-radius:10px;
  padding:6px 11px;margin-right:8px;cursor:pointer;
}
.btn{
  background:var(--grad);color:#fff;border:1px solid rgba(255,255,255,0.28);
  border-radius:14px;padding:10px 16px;font-weight:700;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.45),0 6px 22px rgba(168,85,247,0.48);
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.ghost{
  background:linear-gradient(145deg,rgba(255,255,255,0.14),rgba(255,255,255,0.04));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--fg);border:1px solid var(--line);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.22);
}
.ghost:hover{background:var(--glass-hi)}
.ic{
  background:none;border:0;color:var(--mut);font-size:14px;padding:6px 8px;
  display:inline-flex;align-items:center;gap:6px;border-radius:11px;
}
.ic:hover{background:rgba(255,255,255,0.10);color:#fff}
.ic.liked{color:#fb7185}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut);font-size:12.5px}
.err{color:#fda4af;font-size:13px;min-height:18px;margin-top:4px}
.u{cursor:pointer}

.av{
  width:38px;height:38px;border-radius:50%;
  background:var(--grad-cool);padding:2px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px rgba(168,85,247,0.4);overflow:hidden;
}
.av-in{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(145deg,rgba(30,27,75,0.88),rgba(15,23,42,0.94));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#f3e8ff;text-transform:uppercase;
}
.av img,.prof-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.post img{
  width:100%;border-radius:18px;margin:10px 0;display:block;
  border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.post p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px;color:#f8fafc}
.post-actions{border-top:1px solid rgba(255,255,255,0.12);padding-top:8px;margin-top:8px}
.cm{border-top:1px solid var(--line-soft);margin-top:8px;padding-top:8px;font-size:14px}
.cm div{margin:6px 0}
.cm b{margin-right:6px;color:#f0abfc}

.tabs{
  display:flex;gap:8px;margin-bottom:14px;
  background:linear-gradient(145deg,rgba(255,255,255,0.10),rgba(255,255,255,0.03));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:5px;border-radius:17px;border:1px solid var(--line);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.2);
}
.tabs button{flex:1;padding:9px;border-radius:12px;font-size:13.5px}

.prof-card{padding:0;overflow:hidden}
.prof-cover{
  height:110px;
  background:
    radial-gradient(circle at 20% 20%,rgba(56,189,248,0.55),transparent 55%),
    radial-gradient(circle at 85% 30%,rgba(236,72,153,0.55),transparent 55%),
    linear-gradient(125deg,rgba(79,70,229,0.78) 0%,rgba(147,51,234,0.78) 55%,rgba(219,39,119,0.78) 100%);
  position:relative;border-bottom:1px solid rgba(255,255,255,0.22);
}
.prof-cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.18),transparent 65%);
}
.prof-body{padding:0 16px 16px}
.prof-av{
  width:78px;height:78px;border-radius:50%;
  background:var(--grad-cool);padding:3px;
  margin-top:-39px;position:relative;z-index:2;
  box-shadow:0 8px 26px rgba(0,0,0,0.55),0 0 20px rgba(168,85,247,0.45);overflow:hidden;
}
.prof-av .av-in{font-size:26px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  text-align:center;margin:14px 0;padding:11px 6px;
  background:linear-gradient(145deg,rgba(255,255,255,0.10),rgba(255,255,255,0.03));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line-soft);border-radius:17px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.18);
}
.stats div{font-size:11.5px;color:var(--mut)}
.stats b{display:block;font-size:17px;color:#fff;margin-bottom:2px}

nav{
  position:fixed;bottom:0;left:0;right:0;z-index:15;
  display:flex;justify-content:space-around;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,0.13),rgba(12,15,34,0.80));
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--line);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.25),0 -10px 30px rgba(0,0,0,0.45);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
nav button.nav-item{
  flex:1;padding:6px 2px;background:none;border:0;
  color:var(--mut);font-weight:600;font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
nav button.nav-item svg{
  width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
nav button.on{color:#f0abfc}
nav button.on svg{filter:drop-shadow(0 0 10px rgba(232,121,249,0.85))}
nav button.fab-plus{
  width:48px;height:48px;flex:0 0 48px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.35);background:var(--grad);color:#fff;
  font-size:25px;line-height:1;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:-19px;box-shadow:inset 0 1px 1px rgba(255,255,255,0.5),0 0 24px rgba(168,85,247,0.75);
}
nav button.fab-plus:hover{filter:brightness(1.1)}

.sheet{
  position:fixed;inset:0;
  background:rgba(3,5,14,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:30;display:flex;align-items:flex-end;justify-content:center;
}
.sheet>div{
  background:linear-gradient(155deg,rgba(255,255,255,0.14),rgba(18,22,46,0.88));
  backdrop-filter:blur(28px) saturate(175%);-webkit-backdrop-filter:blur(28px) saturate(175%);
  border:1px solid var(--line);border-bottom:0;
  width:100%;max-width:540px;border-radius:26px 26px 0 0;padding:16px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.28),0 -12px 40px rgba(0,0,0,0.55);
}
.sheet button{
  display:block;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line-soft);
  color:var(--fg);padding:14px 6px;font-weight:500;
}
.sheet button:last-child{border-bottom:0}
.sheet .d{color:#fda4af}
</style>
</head>

<body>
<header>
  <span class="logo-mark">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none">
      <defs>
        <linearGradient id="tvArmL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="55%" stop-color="#c084fc"/>
          <stop offset="100%" stop-color="#f472b6"/>
        </linearGradient>
        <linearGradient id="tvArmR" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2dd4bf"/>
          <stop offset="55%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#818cf8"/>
        </linearGradient>
        <linearGradient id="tvLeg" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e879f9"/>
          <stop offset="55%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
      </defs>
      <path d="M13.2 4.5h5.2a2.6 2.6 0 0 1 2.2 4l-1.5 2.4c-.4.6-1.1.8-1.8.6l-1.2-.4-3.6 7.8c-.4.9-1.7.6-1.7-.4v-6.4l3.6-5.2z" fill="url(#tvArmR)"/>
      <path d="M4.8 4.5h6.8c.7 0 1.4.3 1.8.9l2.4 3.4c.5.7 0 1.7-.9 1.7H7.4a2.8 2.8 0 0 1-2.6-6z" fill="url(#tvArmL)"/>
      <path d="M9.6 11.4h4.8v6.2a2.4 2.4 0 0 1-4.8 0z" fill="url(#tvLeg)"/>
    </svg>
  </span>
  <div>TinVin <span class="brand-sub">Social</span></div>
</header>

<div class="wrap">
<div id="auth" class="card hidden" style="margin-top:24px;padding:22px">
  <h2 id="aT" style="margin:0 0 4px;font-size:24px">Welcome back</h2>
  <p class="mut" style="margin:0 0 14px">Connect. Share. Inspire.</p>
  <input id="aE" type="email" placeholder="Email" autocomplete="email">
  <input id="aU" placeholder="Username (letters, numbers, _)" class="hidden">
  <div style="position:relative">
    <input id="aP" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" style="padding-right:46px">
    <button type="button" class="ic" id="aEye" aria-label="Show password" style="position:absolute;right:6px;top:10px;color:var(--mut);display:flex;line-height:0">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
    </button>
  </div>
  <button class="btn" id="aB" style="width:100%;margin-top:8px;padding:12px">Login</button>
  <div class="err" id="aM"></div>
  <p class="mut" style="text-align:center;margin-top:12px"><span id="aF" style="color:var(--ac);cursor:pointer">Forgot password?</span></p>
  <p class="mut" style="text-align:center"><span id="aS" style="color:var(--ac);cursor:pointer;font-weight:600">Create account</span></p>
</div>
<div id="app" class="hidden"><div id="view"></div></div>
</div>

<nav id="nav" class="hidden">
  <button type="button" class="nav-item on" data-v="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button type="button" class="nav-item" data-v="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Explore</span>
  </button>
  <button type="button" class="fab-plus" id="newPostBtn" aria-label="New post">+</button>
  <button type="button" class="nav-item" data-v="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
    <span>Profile</span>
  </button>
  <button type="button" class="nav-item" data-v="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.42 1.15H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>
<div id="sheet" class="sheet hidden"></div>

<script>
"use strict";
const API="https://tinvin-social-api.aslan89aslan1.workers.dev";
let token=localStorage.getItem("tvs_token")||"",me=null,mode="login",tab=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const init=s=>esc((String(s||"?").trim()[0]||"?"));
const avHtml=(u,cls="av",inCls="av-in")=>{
  const k=u?.avatar_key||u?.avatar||"";
  return k
    ? `<div class="${cls}"><img src="${API}/img/${esc(k)}" alt=""></div>`
    : `<div class="${cls}"><div class="${inCls}">${init(u?.username)}</div></div>`;
};
const vb=v=>v?' <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle"><path fill="#38bdf8" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91C2.88 9.33 2 10.57 2 12s.88 2.67 2.19 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/><path fill="#fff" d="M9.5 16.5l-3.5-3.5 1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></svg>':"";
const ago=t=>{const s=Math.floor(Date.now()/1000)-t;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};

async function api(path,opt={}){
  const h={...(opt.headers||{})};
  if(!(opt.raw))h["Content-Type"]="application/json";
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...opt,headers:h});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token){logout(true)}throw new Error(d.error||"Request failed.")}
  return d;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

$("aS").onclick=()=>{mode=mode==="login"?"signup":"login";
  $("aT").textContent=mode==="login"?"Welcome back":"Create account";
  $("aB").textContent=mode==="login"?"Login":"Sign up";
  $("aS").textContent=mode==="login"?"Create account":"I have an account";
  $("aU").classList.toggle("hidden",mode==="login");$("aF").classList.toggle("hidden",mode!=="login");$("aM").textContent=""};
$("aB").onclick=async()=>{
  $("aM").textContent="";$("aM").style.color="";
  if(mode==="reset"){try{await post("/api/reset",{token:resetTok,password:$("aP").value});alert("Password changed. Please log in.");history.replaceState(null,"",location.pathname);location.reload()}catch(e){$("aM").textContent=e.message}return}
  try{
    const d=await post("/api/"+mode,{email:$("aE").value,username:$("aU").value,password:$("aP").value});
    token=d.token;localStorage.setItem("tvs_token",token);start();
  }catch(e){$("aM").textContent=e.message}
};
let resetTok="";
const EYE='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
$("aEye").onclick=()=>{const p=$("aP"),show=p.type==="password";p.type=show?"text":"password";$("aEye").innerHTML=show?EYE:EYEOFF};
$("aF").onclick=async()=>{
  const em=$("aE").value.trim();
  if(!em){$("aM").textContent="Enter your email first.";return}
  try{await post("/api/forgot",{email:em});$("aM").style.color="#22c55e";$("aM").textContent="If this email exists, we sent a reset link."}catch(e){$("aM").textContent=e.message}
};
function resetMode(t){resetTok=t;mode="reset";$("aT").textContent="Set new password";
  ["aE","aU","aF","aS"].forEach(i=>$(i).classList.add("hidden"));
  $("aP").placeholder="New password (8+ characters)";$("aP").autocomplete="new-password";$("aB").textContent="Save password"}
function logout(silent){
  if(!silent&&token)api("/api/logout",{method:"POST"}).catch(()=>{});
  token="";me=null;localStorage.removeItem("tvs_token");
  $("auth").classList.remove("hidden");$("app").classList.add("hidden");$("nav").classList.add("hidden");
}
async function start(){
  try{me=(await api("/api/me")).user}catch{return logout(true)}
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");
  go("home");
}

document.querySelectorAll("nav button.nav-item").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("newPostBtn").onclick=async()=>{
  await go("home");
  window.scrollTo({top:0,behavior:"smooth"});
  const box=$("pT");
  if(box)box.focus();
};
function go(v,arg){
  document.querySelectorAll("nav button.nav-item").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="home")return home();
  if(v==="search")return search();
  if(v==="me")return profile(me.username);
  if(v==="user")return profile(arg);
  if(v==="settings")return settings();
}

function card(p,refresh){
  const d=document.createElement("div");d.className="card post";
  d.innerHTML=`<div class="row">
    <span class="u">${avHtml(p)}</span>
    <div class="u">
      <div style="font-weight:700;font-size:14.5px">@${esc(p.username)}${vb(p.verified)}</div>
      <div class="mut" style="font-size:11.5px">${ago(p.created_at)} ago</div>
    </div>
    <span class="sp"></span>
    <button class="ic" data-m aria-label="More">&#8943;</button>
  </div>
  ${p.text?`<p>${esc(p.text)}</p>`:""}${p.image_key?`<img loading="lazy" src="${API}/img/${p.image_key}" alt="">`:""}
  <div class="row post-actions">
    <button class="ic ${p.liked?"liked":""}" data-l>${p.liked?"&#9829;":"&#9825;"} <span>${p.likes}</span></button>
    <button class="ic" data-c>&#128172; <span>${p.comments}</span></button>
    <button class="ic" data-s>&#8599; Share</button>
  </div>
  <div class="cm hidden"></div>`;
  d.querySelectorAll(".u").forEach(el=>el.onclick=()=>go("user",p.username));
  d.querySelector("[data-l]").onclick=async()=>{await post("/api/like/"+p.id);refresh()};
  d.querySelector("[data-s]").onclick=async()=>{
    const data={title:"TinVin Social",text:(p.text||"Post by @"+p.username),url:location.href.split("#")[0]};
    try{navigator.share?await navigator.share(data):(await navigator.clipboard.writeText(data.url),alert("Link copied"))}catch{}
  };
  const cm=d.querySelector(".cm");
  d.querySelector("[data-c]").onclick=()=>{cm.classList.toggle("hidden");if(!cm.classList.contains("hidden"))comments(p.id,cm,refresh)};
  d.querySelector("[data-m]").onclick=()=>menu(p,refresh);
  return d;
}
async function comments(id,box,refresh){
  box.innerHTML="<span class='mut'>Loading...</span>";
  try{
    const c=(await api("/api/comments/"+id)).comments;
    box.innerHTML=c.map(x=>`<div><b>@${esc(x.username)}${vb(x.verified)}</b>${esc(x.text)}</div>`).join("")+
      `<div class="row" style="margin-top:8px"><input placeholder="Add a comment..." maxlength="300" style="margin:0"><button class="btn">Send</button></div>`;
    box.querySelector(".btn").onclick=async()=>{
      const i=box.querySelector("input");if(!i.value.trim())return;
      await post("/api/comments/"+id,{text:i.value});refresh();
    };
  }catch(e){box.textContent=e.message}
}
function menu(p,refresh){
  const s=$("sheet");s.classList.remove("hidden");
  const own=p.uid===me.id;
  s.innerHTML=`<div>${own?`<button class="d" data-a="del">Delete post</button>`:
    `<button data-r="Spam">Report: spam</button><button data-r="Harassment or hate">Report: harassment or hate</button>
     <button data-r="Nudity or violence">Report: nudity or violence</button><button data-r="False information">Report: false information</button>
     <button class="d" data-a="block">Block @${esc(p.username)}</button>`}<button data-a="x">Cancel</button></div>`;
  s.onclick=e=>{if(e.target===s)s.classList.add("hidden")};
  s.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    s.classList.add("hidden");
    try{
      if(b.dataset.r){await post("/api/report/"+p.id,{reason:b.dataset.r});alert("Thanks. We will review this post.")}
      else if(b.dataset.a==="block"){if(confirm("Block @"+p.username+"?"))await post("/api/block/"+p.uid)}
      else if(b.dataset.a==="del"){if(confirm("Delete this post?"))await api("/api/post/"+p.id,{method:"DELETE"})}
      refresh();
    }catch(e){alert(e.message)}
  });
}

async function home(){
  $("view").innerHTML=`<div class="card">
    <div class="row" style="align-items:flex-start">
      ${avHtml(me)}
      <textarea id="pT" maxlength="500" placeholder="Share something with TinVin..." style="margin:0"></textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="pF" type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="margin:0">
      <button class="btn" id="pB">Post</button>
    </div>
    <div class="err" id="pM"></div>
  </div>
  <div class="tabs">
    <button class="btn ${tab?"ghost":""}" data-t="0">For You</button>
    <button class="btn ${tab?"":"ghost"}" data-t="1">Following</button>
  </div>
  <div id="feed"><p class="mut" style="text-align:center">Loading...</p></div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=+b.dataset.t;home()});
  $("pB").onclick=async()=>{
    $("pM").textContent="";$("pB").disabled=true;
    try{
      let image=null;const f=$("pF").files[0];
      if(f)image=(await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":f.type},body:f})).key;
      await post("/api/post",{text:$("pT").value,image});home();
    }catch(e){$("pM").textContent=e.message;$("pB").disabled=false}
  };
  loadFeed();
}
async function loadFeed(){
  try{
    const posts=(await api("/api/feed?f="+tab)).posts;
    const box=$("feed");box.innerHTML="";
    if(!posts.length)box.innerHTML=`<div class="card"><p class="mut" style="text-align:center;margin:8px 0">No posts yet.</p></div>`;
    posts.forEach(p=>box.appendChild(card(p,loadFeed)));
  }catch(e){$("feed").textContent=e.message}
}

let sq="";
function search(){
  $("view").innerHTML=`<div class="card"><input id="sI" placeholder="Search people or posts..." maxlength="50" value="${esc(sq)}" style="margin:0"></div><div id="sR"></div>`;
  const hint=`<p class="mut" style="text-align:center">Type at least 2 characters.</p>`;
  const run=async()=>{
    sq=$("sI").value.trim();const box=$("sR");
    if(sq.length<2){box.innerHTML=hint;return}
    box.innerHTML="<p class='mut' style='text-align:center'>Searching...</p>";
    try{
      const d=await api("/api/search?q="+encodeURIComponent(sq));
      box.innerHTML="";
      if(!d.users.length&&!d.posts.length){box.innerHTML=`<p class="mut" style="text-align:center">No results.</p>`;return}
      if(d.users.length){
        const c=document.createElement("div");c.className="card";
        c.innerHTML=`<b style="display:block;margin-bottom:6px;color:#f0abfc">People</b>`+d.users.map(u=>`<div class="row u" data-n="${esc(u.username)}" style="padding:10px 0;border-top:1px solid var(--line-soft)">
          ${avHtml(u)}
          <div><b>@${esc(u.username)}${vb(u.verified)}</b><div class="mut">${esc(u.bio||"")}</div></div>
        </div>`).join("");
        c.querySelectorAll("[data-n]").forEach(r=>r.onclick=()=>go("user",r.dataset.n));
        box.appendChild(c);
      }
      d.posts.forEach(p=>box.appendChild(card(p,run)));
    }catch(e){box.textContent=e.message}
  };
  let t;$("sI").oninput=()=>{clearTimeout(t);t=setTimeout(run,400)};
  if(sq)run();else $("sR").innerHTML=hint;
}

async function profile(name){
  $("view").innerHTML="<p class='mut' style='text-align:center'>Loading...</p>";
  try{
    const d=await api("/api/user/"+encodeURIComponent(name)),own=d.user.id===me.id;
    $("view").innerHTML=`<div class="card prof-card">
      <div class="prof-cover"></div>
      <div class="prof-body">
        <div class="row" style="align-items:flex-end;justify-content:space-between">
          ${avHtml(d.user,"prof-av","av-in")}
          <button class="btn ghost" id="shB" style="padding:8px 13px;font-size:12.5px">Share profile</button>
        </div>
        <h2 style="margin:10px 0 2px;font-size:21px">@${esc(d.user.username)}${vb(d.user.verified)}</h2>
        <p class="mut" style="margin:4px 0 0;font-size:13.5px;color:#e2e8f0">${esc(d.user.bio||"No bio yet.")}</p>
        <div class="stats">
          <div><b>${d.counts.posts}</b>Posts</div>
          <div><b>${d.counts.followers}</b>Followers</div>
          <div><b>${d.counts.following}</b>Following</div>
        </div>
        <div class="row" style="flex-wrap:wrap">
          ${own?`<button class="btn sp" id="eB">Edit bio</button><button class="btn ghost sp" id="eN">Edit name</button><button class="btn ghost sp" id="eAv">Photo</button><input id="avF" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden">`:
          `<button class="btn ${d.is_following?"ghost":""} sp" id="fB">${d.is_following?"Following":"Follow"}</button>`}
        </div>
      </div>
    </div><div id="pp"></div>`;
    const re=()=>profile(name);
    if(own){
      $("eN").onclick=async()=>{const n=prompt("New username (3-20 letters, numbers, _)",d.user.username);if(n===null||n.trim()===d.user.username)return;try{await post("/api/me",{username:n});me.username=n.trim();profile(n.trim())}catch(e){alert(e.message)}};
      $("eB").onclick=async()=>{const b=prompt("Your bio (160 characters)",d.user.bio||"");if(b!==null){await post("/api/me",{bio:b});re()}};
      $("eAv").onclick=()=>$("avF").click();
      $("avF").onchange=async()=>{
        const f=$("avF").files[0];if(!f)return;
        try{
          const up=await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":f.type},body:f});
          await post("/api/me",{avatar:up.key});
          re();
        }catch(e){alert(e.message)}
      };
    }
    else $("fB").onclick=async()=>{await post("/api/follow/"+d.user.id);re()};
    $("shB").onclick=async()=>{const data={title:"TinVin Social",text:"@"+d.user.username+" on TinVin Social",url:location.href.split("#")[0]};
      try{navigator.share?await navigator.share(data):(await navigator.clipboard.writeText(data.url),alert("Link copied"))}catch{}};
    if(!d.posts.length)$("pp").innerHTML=`<div class="card"><p class="mut" style="text-align:center;margin:8px 0">No posts yet.</p></div>`;
    d.posts.forEach(p=>$("pp").appendChild(card(p,re)));
  }catch(e){$("view").textContent=e.message}
}

function settings(){
  $("view").innerHTML=`<div class="card"><h3 style="margin-top:0">Settings</h3>
    <p class="mut">Signed in as <b style="color:var(--fg)">${esc(me.email)}</b></p>
    <p><a href="privacy.html" style="color:var(--ac);text-decoration:none">Privacy policy &rarr;</a></p>
    <p><a href="terms.html" style="color:var(--ac);text-decoration:none">Terms and community rules &rarr;</a></p>
    <button class="btn ghost" id="lo" style="width:100%;margin-top:6px">Logout</button>
    <p style="margin-top:16px"><button class="btn" id="del" style="width:100%;background:var(--dn);box-shadow:none">Delete account</button></p>
    <p class="mut">Deleting your account permanently removes your profile, posts, comments and likes.</p></div>`;
  $("lo").onclick=()=>logout();
  $("del").onclick=async()=>{
    if(!confirm("Delete your account and all your content? This can't be undone."))return;
    try{await api("/api/me",{method:"DELETE"});logout(true)}catch(e){alert(e.message)}
  };
}

const rt=(location.hash.match(/^#reset=(r_[a-f0-9]+)/)||[])[1];
if(rt){logout(true);resetMode(rt)}else token?start():logout(true);
</script>
</body>
</html>
