<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070914">
<title>TinVin Social</title>
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--fg:#f8fafc;--mut:#94a3b8;--ac:#38bdf8;--pur:#a855f7;--pnk:#ec4899;--dn:#ef4444}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding-bottom:78px;color:var(--fg);font-family:Arial,sans-serif;background:radial-gradient(circle at 15% 15%,rgba(56,189,248,.28),transparent 42%),radial-gradient(circle at 85% 20%,rgba(168,85,247,.3),transparent 45%),radial-gradient(circle at 50% 88%,rgba(236,72,153,.22),transparent 48%),var(--bg)}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;padding:13px 16px;font-weight:800;font-size:19px;background:rgba(10,14,28,.75);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
header span{background:linear-gradient(90deg,var(--ac),var(--pur),var(--pnk));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
input,textarea{width:100%;padding:11px;margin:6px 0;background:rgba(8,12,24,.65);color:var(--fg);border:1px solid var(--line);border-radius:12px;outline:none}
textarea{min-height:68px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--ac),var(--pur));color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.btn-live{background:linear-gradient(135deg,#ef4444,var(--pnk));color:#fff;border:0;border-radius:12px;padding:9px 12px;font-weight:700}
.ghost{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line)}
.ic{background:none;border:0;color:var(--fg);font-size:15px;padding:6px 8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:12px}.err{color:#f87171;font-size:13px;min-height:18px}.u{cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.35)}
.av-lg{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2.5px solid var(--pur)}
.post img{width:100%;border-radius:12px;margin:8px 0;display:block}.post p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}.cm div{margin:5px 0}.cm b{margin-right:6px}
.msgs{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.msg{padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:14px}
.live-bar{margin-top:10px;padding:10px;border-radius:12px;background:rgba(236,72,153,.15);border:1px dashed rgba(236,72,153,.55);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,14,28,.85);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
nav button{flex:1;padding:13px 6px;background:none;border:0;color:var(--mut);font-weight:700;font-size:13px}nav .on{color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.stats{display:flex;justify-content:space-around;text-align:center;margin:12px 0}.stats b{display:block;font-size:18px}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:#12182b;border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px}
.sheet button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 4px}.sheet .d{color:#f87171}
</style>
</head>
<body>
<header>TinVin <span>Social</span></header>
<div class="wrap">
  <div id="auth" class="card hidden">
    <h2 id="aT">Welcome back</h2>
    <input id="aE" type="email" placeholder="Email" autocomplete="email">
    <input id="aU" placeholder="Username (letters, numbers, _)" class="hidden">
    <div style="position:relative">
      <input id="aP" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" style="padding-right:44px">
      <button type="button" class="ic" id="aEye" style="position:absolute;right:4px;top:9px;color:var(--mut)">👁</button>
    </div>
    <button class="btn" id="aB" style="width:100%">Login</button>
    <div class="err" id="aM"></div>
    <p class="mut" style="text-align:center"><span id="aF" style="color:var(--ac);cursor:pointer">Forgot password?</span></p>
    <p class="mut" style="text-align:center"><span id="aS" style="color:var(--ac);cursor:pointer">Create account</span></p>
  </div>
  <div id="app" class="hidden"><div id="view"></div></div>
</div>
<nav id="nav" class="hidden">
  <button data-v="home" class="on">Home</button>
  <button data-v="chat">Chat & Live</button>
  <button data-v="search">Search</button>
  <button data-v="me">Profile</button>
  <button data-v="settings">Settings</button>
</nav>
<div id="sheet" class="sheet hidden"></div>

<script>
"use strict";
const API="https://tinvin-social-api.aslan89aslan1.workers.dev";
let token=localStorage.getItem("tvs_token")||"",me=null,mode="login",tab=0,room="global",resetTok="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vb=v=>v?' <span style="color:#38bdf8">✔</span>':"";
const ago=t=>{const s=Math.floor(Date.now()/1000)-t;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};
const avSrc=k=>k?`${API}/img/${k}`:"https://i.pravatar.cc/200?img=32";

async function api(path,opt={}){
  const h={...(opt.headers||{})};
  if(!opt.raw)h["Content-Type"]="application/json";
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...opt,headers:h});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token)logout(true);throw new Error(d.error||"Request failed.")}
  return d;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

$("aS").onclick=()=>{mode=mode==="login"?"signup":"login";$("aT").textContent=mode==="login"?"Welcome back":"Create account";$("aB").textContent=mode==="login"?"Login":"Sign up";$("aS").textContent=mode==="login"?"Create account":"I have an account";$("aU").classList.toggle("hidden",mode==="login");$("aF").classList.toggle("hidden",mode!=="login");$("aM").textContent=""};
$("aB").onclick=async()=>{
  $("aM").textContent="";$("aM").style.color="";
  if(mode==="reset"){try{await post("/api/reset",{token:resetTok,password:$("aP").value});alert("Password changed.");history.replaceState(null,"",location.pathname);location.reload()}catch(e){$("aM").textContent=e.message}return}
  try{const d=await post("/api/"+mode,{email:$("aE").value,username:$("aU").value,password:$("aP").value});token=d.token;localStorage.setItem("tvs_token",token);start()}catch(e){$("aM").textContent=e.message}
};
$("aEye").onclick=()=>{$("aP").type=$("aP").type==="password"?"text":"password"};
$("aF").onclick=async()=>{const em=$("aE").value.trim();if(!em)return $("aM").textContent="Enter email first.";try{await post("/api/forgot",{email:em});$("aM").style.color="#22c55e";$("aM").textContent="Reset link sent if email exists."}catch(e){$("aM").textContent=e.message}};
function resetMode(t){resetTok=t;mode="reset";$("aT").textContent="Set new password";["aE","aU","aF","aS"].forEach(i=>$(i).classList.add("hidden"));$("aB").textContent="Save password"}
function logout(silent){if(!silent&&token)api("/api/logout",{method:"POST"}).catch(()=>{});token="";me=null;localStorage.removeItem("tvs_token");$("auth").classList.remove("hidden");$("app").classList.add("hidden");$("nav").classList.add("hidden")}
async function start(){try{me=(await api("/api/me")).user}catch{return logout(true)}$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");go("home")}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,arg){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));({home,chat:chatView,search,me:()=>profile(me.username),user:()=>profile(arg),settings})[v]()}

function card(p,refresh){
  const d=document.createElement("div");d.className="card post";
  d.innerHTML=`<div class="row"><img class="av" src="${avSrc(p.avatar_key)}" alt=""><b class="u">@${esc(p.username)}${vb(p.verified)}</b><span class="mut">${ago(p.created_at)}</span><span class="sp"></span><button class="ic" data-m>•••</button></div>${p.text?`<p>${esc(p.text)}</p>`:""}${p.image_key?`<img loading="lazy" src="${API}/img/${p.image_key}" alt="">`:""}<div class="row"><button class="ic" data-l>${p.liked?"♥":"♡"} ${p.likes}</button><button class="ic" data-c>Comments ${p.comments}</button><button class="ic" data-s>Share</button></div><div class="cm hidden"></div>`;
  d.querySelector(".u").onclick=()=>go("user",p.username);
  d.querySelector("[data-l]").onclick=async()=>{await post("/api/like/"+p.id);refresh()};
  d.querySelector("[data-s]").onclick=async()=>{try{navigator.share?await navigator.share({title:"TinVin Social",url:location.href.split("#")[0]}):(await navigator.clipboard.writeText(location.href.split("#")[0]),alert("Link copied"))}catch{}};
  const cm=d.querySelector(".cm");
  d.querySelector("[data-c]").onclick=()=>{cm.classList.toggle("hidden");if(!cm.classList.contains("hidden"))comments(p.id,cm,refresh)};
  d.querySelector("[data-m]").onclick=()=>menu(p,refresh);
  return d;
}
async function comments(id,box,refresh){
  box.innerHTML="Loading...";
  try{const c=(await api("/api/comments/"+id)).comments;box.innerHTML=c.map(x=>`<div><b>@${esc(x.username)}</b>${esc(x.text)}</div>`).join("")+`<div class="row"><input placeholder="Add a comment" maxlength="300" style="margin:0;flex:1"><button class="btn">Send</button></div>`;box.querySelector(".btn").onclick=async()=>{const i=box.querySelector("input");if(!i.value.trim())return;await post("/api/comments/"+id,{text:i.value});refresh()}}catch(e){box.textContent=e.message}
}
function menu(p,refresh){
  const s=$("sheet");s.classList.remove("hidden");const own=p.uid===me.id;
  s.innerHTML=`<div>${own?`<button class="d" data-a="del">Delete post</button>`:`<button data-r="Spam">Report: spam</button><button data-r="Harassment">Report: harassment</button><button class="d" data-a="block">Block @${esc(p.username)}</button>`}<button data-a="x">Cancel</button></div>`;
  s.onclick=e=>{if(e.target===s)s.classList.add("hidden")};
  s.querySelectorAll("button").forEach(b=>b.onclick=async()=>{s.classList.add("hidden");try{if(b.dataset.r){await post("/api/report/"+p.id,{reason:b.dataset.r});alert("Reported.")}else if(b.dataset.a==="block"){await post("/api/block/"+p.uid)}else if(b.dataset.a==="del"){await api("/api/post/"+p.id,{method:"DELETE"})}refresh()}catch(e){alert(e.message)}});
}

async function home(){
  $("view").innerHTML=`<div class="card"><textarea id="pT" maxlength="500" placeholder="What's on your mind?"></textarea><div class="row"><input id="pF" type="file" accept="image/*" style="margin:0;flex:1"><button class="btn" id="pB">Post</button></div><div class="err" id="pM"></div></div><div class="tabs"><button class="btn ${tab?"ghost":""}" data-t="0">Everyone</button><button class="btn ${tab?"":"ghost"}" data-t="1">Following</button></div><div id="feed">Loading...</div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=+b.dataset.t;home()});
  $("pB").onclick=async()=>{try{let image=null;const f=$("pF").files[0];if(f)image=(await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":f.type},body:f})).key;await post("/api/post",{text:$("pT").value,image});home()}catch(e){$("pM").textContent=e.message}};
  loadFeed();
}
async function loadFeed(){try{const posts=(await api("/api/feed?f="+tab)).posts;$("feed").innerHTML=posts.length?"":`<p class="mut">No posts yet.</p>`;posts.forEach(p=>$("feed").appendChild(card(p,loadFeed)))}catch(e){$("feed").textContent=e.message}}

function chatView(){
  $("view").innerHTML=`<div class="card"><div class="row"><b>Messages & Calls</b><span class="sp"></span><button class="btn" data-m="voice">Voice</button><button class="btn" data-m="call">Call</button><button class="btn-live" data-m="live">Live</button></div><div id="liveBar" class="live-bar ${room==="global"?"hidden":""}"></div><div id="msgs" class="msgs">Loading...</div><div class="row"><input id="mI" placeholder="Write a message..." maxlength="500" style="margin:0;flex:1"><button class="btn" id="mS">Send</button></div><div class="err" id="mE"></div></div>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=async()=>{try{const r=await post("/api/call",{mode:b.dataset.m});room=r.roomId;$("liveBar").classList.remove("hidden");$("liveBar").innerHTML=`<b>${esc(r.mode.toUpperCase())}</b> Room: <code>${esc(r.roomId)}</code> <button class="ghost" id="endR">Leave</button>`;$("endR").onclick=()=>{room="global";$("liveBar").classList.add("hidden");loadMsgs()};loadMsgs()}catch(e){$("mE").textContent=e.message}});
  $("mS").onclick=async()=>{const txt=$("mI").value.trim();if(!txt)return;try{await post("/api/messages",{room,text:txt});$("mI").value="";loadMsgs()}catch(e){$("mE").textContent=e.message}};
  loadMsgs();
}
async function loadMsgs(){try{const list=(await api("/api/messages?room="+encodeURIComponent(room))).messages;$("msgs").innerHTML=list.map(m=>`<div class="msg"><b>@${esc(m.username)}</b>: ${esc(m.text)}</div>`).join("")||`<p class="mut">No messages yet.</p>`;$("msgs").scrollTop=$("msgs").scrollHeight}catch(e){$("msgs").textContent=e.message}}

let sq="";
function search(){
  $("view").innerHTML=`<div class="card"><input id="sI" placeholder="Search people or posts" value="${esc(sq)}"></div><div id="sR"><p class="mut">Type at least 2 characters.</p></div>`;
  const run=async()=>{sq=$("sI").value.trim();if(sq.length<2)return;$("sR").textContent="Searching...";try{const d=await api("/api/search?q="+encodeURIComponent(sq));$("sR").innerHTML="";if(d.users.length){const c=document.createElement("div");c.className="card";c.innerHTML=`<b>People</b>`+d.users.map(u=>`<div class="row u" data-n="${esc(u.username)}" style="padding:8px 0;border-top:1px solid var(--line)"><img class="av" src="${avSrc(u.avatar_key)}" alt=""><b>@${esc(u.username)}</b></div>`).join("");c.querySelectorAll("[data-n]").forEach(r=>r.onclick=()=>go("user",r.dataset.n));$("sR").appendChild(c)}d.posts.forEach(p=>$("sR").appendChild(card(p,run)))}catch(e){$("sR").textContent=e.message}};
  let t;$("sI").oninput=()=>{clearTimeout(t);t=setTimeout(run,350)};if(sq)run();
}

async function profile(name){
  $("view").innerHTML="Loading...";
  try{
    const d=await api("/api/user/"+encodeURIComponent(name)),own=d.user.id===me.id;
    $("view").innerHTML=`<div class="card"><div class="row"><img class="av-lg" src="${avSrc(d.user.avatar_key)}" alt=""><div><h2 style="margin:0">@${esc(d.user.username)}${vb(d.user.verified)}</h2><p class="mut">${esc(d.user.bio||"")}</p>${own?`<label class="btn ghost" style="padding:6px 10px;font-size:12px">Change photo <input type="file" id="avF" accept="image/*" hidden></label>`:""}</div></div><div class="stats"><div><b>${d.counts.posts}</b>Posts</div><div><b>${d.counts.followers}</b>Followers</div><div><b>${d.counts.following}</b>Following</div></div><div class="row">${own?`<button class="btn ghost sp" id="eB">Edit bio</button><button class="btn ghost sp" id="eN">Edit name</button>`:`<button class="btn sp" id="fB">${d.is_following?"Following":"Follow"}</button>`}</div></div><div id="pp"></div>`;
    const re=()=>profile(name);
    if(own){$("avF").onchange=async()=>{const f=$("avF").files[0];if(!f)return;try{const up=await api("/api/upload",{method:"POST",raw:true,headers:{"Content-Type":f.type},body:f});await post("/api/me",{avatar_key:up.key});me.avatar_key=up.key;re()}catch(e){alert(e.message)}};$("eN").onclick=async()=>{const n=prompt("New username",d.user.username);if(n&&n.trim()!==d.user.username){await post("/api/me",{username:n});me.username=n.trim();profile(n.trim())}};$("eB").onclick=async()=>{const b=prompt("Your bio",d.user.bio||"");if(b!==null){await post("/api/me",{bio:b});re()}}}else $("fB").onclick=async()=>{await post("/api/follow/"+d.user.id);re()};
    d.posts.forEach(p=>$("pp").appendChild(card(p,re)));
  }catch(e){$("view").textContent=e.message}
}

function settings(){
  $("view").innerHTML=`<div class="card"><h3>Account</h3><p class="mut">Signed in as ${esc(me.email)}</p><div class="row"><button class="btn ghost sp" id="sN">Change name</button><button class="btn ghost sp" id="sB">Edit bio</button></div></div><div class="card"><h3>Security</h3><button class="btn ghost" id="sP">Change password</button><div id="pf" class="hidden"><input id="pC" type="password" placeholder="Current password"><input id="pN" type="password" placeholder="New password"><button class="btn" id="pS">Save</button><div class="err" id="pM2"></div></div><p><button class="btn ghost" id="sA">Log out of all devices</button></p></div><div class="card"><h3>Blocked</h3><div id="bl" class="mut">Loading...</div></div><div class="card"><button class="btn ghost" id="lo">Logout</button><p><button class="btn" id="del" style="background:var(--dn)">Delete account</button></p></div>`;
  $("sN").onclick=async()=>{const n=prompt("New username",me.username);if(n&&n.trim()!==me.username){await post("/api/me",{username:n});me.username=n.trim();alert("Saved.")}};
  $("sB").onclick=async()=>{const b=prompt("Your bio",me.bio||"");if(b!==null){await post("/api/me",{bio:b});me.bio=b;alert("Saved.")}};
  $("sP").onclick=()=>$("pf").classList.toggle("hidden");
  $("pS").onclick=async()=>{try{await post("/api/password",{current:$("pC").value,password:$("pN").value});$("pM2").style.color="#22c55e";$("pM2").textContent="Password changed."}catch(e){$("pM2").textContent=e.message}};
  $("sA").onclick=async()=>{if(confirm("Log out of all devices?")){await post("/api/logout-all");logout(true)}};
  (async()=>{try{const l=(await api("/api/blocks")).users;$("bl").innerHTML=l.length?"":"No blocked accounts.";l.forEach(u=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<b>@${esc(u.username)}</b><span class="sp"></span><button class="btn ghost">Unblock</button>`;r.querySelector("button").onclick=async()=>{await post("/api/unblock/"+u.id);settings()};$("bl").appendChild(r)})}catch(e){$("bl").textContent=e.message}})();
  $("lo").onclick=()=>logout();
  $("del").onclick=async()=>{if(confirm("Delete account permanently?")){await api("/api/me",{method:"DELETE"});logout(true)}};
}

const rt=(location.hash.match(/^#reset=(r_[a-f0-9]+)/)||[])[1];
if(rt){logout(true);resetMode(rt)}else token?start():logout(true);
</script>
</body>
</html>
