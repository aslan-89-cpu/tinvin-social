<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>TinVin Social</title>
<style>
:root{--bg:#0b1020;--card:#151c30;--line:#263049;--fg:#e8ecf5;--mut:#8f9ab3;--ac:#38bdf8;--up:#22c55e;--dn:#ef4444}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);font-family:Arial,sans-serif;padding-bottom:70px}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;border-bottom:1px solid var(--line);padding:13px 16px;font-weight:800;font-size:19px}
header span{color:var(--ac)}
.wrap{max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#0e1427;color:var(--fg);border:1px solid var(--line);border-radius:10px;outline:none}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#04121f;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.ic{background:none;border:0;color:var(--fg);font-size:15px;padding:6px 8px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mut{color:var(--mut);font-size:12px}.err{color:#f87171;font-size:13px;min-height:18px}
.u{cursor:pointer}
.post img{width:100%;border-radius:10px;margin:8px 0;display:block}
.post p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.cm div{margin:5px 0}.cm b{margin-right:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,16,32,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;padding:14px;background:none;border:0;color:var(--mut);font-weight:700}nav .on{color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.stats{display:flex;justify-content:space-around;text-align:center;margin:12px 0}.stats b{display:block;font-size:18px}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px}
.sheet button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 4px}
.sheet .d{color:#f87171}
.glass{background:linear-gradient(145deg,rgba(80,110,255,.16),rgba(150,80,255,.10));border:1px solid rgba(140,170,255,.22);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(40,60,200,.18),inset 0 1px 0 rgba(255,255,255,.08);padding:6px 14px;margin-bottom:14px}
.glass h4{margin:12px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid rgba(140,170,255,.12);color:var(--fg);padding:14px 2px;text-align:start;font-size:15px}
.si{display:flex;color:var(--ac)}.sl{flex:1}.ch{color:var(--mut);font-size:20px}
.srow.d,.srow.d .si{color:#f87171}
.pill{font-size:11px;background:rgba(167,139,250,.25);color:#c4b5fd;border-radius:99px;padding:2px 8px}
.spanel{padding:4px 0 12px}
.ava{width:64px;height:64px;border-radius:50%;margin:10px auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#06101f;box-shadow:0 0 24px rgba(120,140,255,.5)}
html{background:#0b1020;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 480px at 15% -8%,rgba(110,80,255,.35),transparent 70%),radial-gradient(700px 480px at 100% 12%,rgba(56,189,248,.20),transparent 70%),radial-gradient(600px 400px at 50% 110%,rgba(167,139,250,.22),transparent 70%),#0b1020}
nav{padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:14px 2px;font-size:13px;position:relative}
nav .orb{flex:0 0 54px;height:54px;margin-top:-20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a5f3fc,#7c83ff 55%,#a78bfa);color:#06101f;font-size:32px;font-weight:300;line-height:1;box-shadow:0 0 22px rgba(124,131,255,.7);padding:0;align-self:flex-start}
.bd{position:absolute;top:6px;right:14%;background:#ef4444;color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}
.sheet .btn{background:var(--ac);color:#04121f;border:0;border-radius:10px;text-align:center;margin:8px 0}
.str{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.sc{flex:0 0 auto;width:64px;text-align:center;font-size:11px;color:var(--mut);cursor:pointer}
.sr{width:60px;height:60px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#38bdf8,#a78bfa);margin:0 auto 4px;box-shadow:0 0 14px rgba(120,140,255,.45)}
.sr>div{width:100%;height:100%;border-radius:50%;background:#0e1427;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--fg)}
.sr.add{background:rgba(140,170,255,.28)}
.sv{position:fixed;inset:0;z-index:50;background:#05060f;display:flex;flex-direction:column}
.sb{display:flex;gap:4px;padding:10px 10px 0}.sb span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25)}.sb span.on{background:#fff}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px;position:relative;z-index:2}
.sm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;overflow:hidden}
.sm img{max-width:100%;max-height:70vh;border-radius:12px}
.sm p{font-size:22px;text-align:center;overflow-wrap:anywhere;white-space:pre-wrap;padding:0 14px;margin:0}
.st{position:absolute;inset:90px 0 0;display:flex}.st i{flex:1}
.msgs{display:flex;flex-direction:column;gap:6px;padding:4px 2px 80px}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#06101f;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:rgba(140,170,255,.16);border-bottom-left-radius:4px}
.cbar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,16,32,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cbar input{margin:0}
.ava2{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#06101f;flex:0 0 auto}
/* THEME v2 - deep space glass */
:root{--bg:#070a1f;--card:#101733;--line:#26335f;--mut:#93a0c8;--ac:#56c6f0}
html{background:#070a1f}
body::before{background:radial-gradient(700px 460px at 12% -6%,rgba(120,80,255,.42),transparent 70%),radial-gradient(640px 460px at 105% 14%,rgba(34,211,238,.24),transparent 70%),radial-gradient(620px 420px at 55% 108%,rgba(176,110,255,.30),transparent 70%),#070a1f}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6;background-size:240px 240px;background-image:radial-gradient(1.2px 1.2px at 30px 40px,#fff,transparent),radial-gradient(1px 1px at 92px 122px,rgba(180,205,255,.95),transparent),radial-gradient(1.5px 1.5px at 172px 62px,#fff,transparent),radial-gradient(1px 1px at 212px 192px,rgba(205,175,255,.95),transparent),radial-gradient(1px 1px at 62px 202px,#fff,transparent),radial-gradient(1.2px 1.2px at 140px 160px,rgba(150,240,255,.9),transparent)}
header{background:rgba(7,10,31,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(140,180,255,.22)}
header div{background:linear-gradient(90deg,#5eead4,#7aa7ff 55%,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header div span{color:inherit}
.card{background:linear-gradient(145deg,rgba(80,110,255,.17),rgba(150,80,255,.10));border:1px solid rgba(140,180,255,.30);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(40,60,200,.20),inset 0 1px 0 rgba(255,255,255,.08)}
input,textarea{background:rgba(8,12,38,.62);border:1px solid rgba(140,180,255,.28);color:var(--fg)}
input:focus,textarea:focus{border-color:#7aa7ff;box-shadow:0 0 0 3px rgba(122,167,255,.18)}
.btn{background:linear-gradient(135deg,#22d3ee,#5b8cff 55%,#a78bfa);color:#06101f;box-shadow:0 4px 16px rgba(91,140,255,.35)}
.ghost{background:rgba(255,255,255,.05);color:var(--fg);border:1px solid rgba(140,180,255,.32);box-shadow:none}
.sheet .btn{background:linear-gradient(135deg,#22d3ee,#5b8cff 55%,#a78bfa);color:#06101f}
.sheet>div{max-height:78vh;overflow-y:auto;background:linear-gradient(160deg,#141c45,#1a1445);border:1px solid rgba(140,180,255,.3)}
nav{background:rgba(10,14,42,.74);border-top:1px solid rgba(140,180,255,.32);box-shadow:0 -8px 30px rgba(90,110,255,.28);border-radius:22px 22px 0 0}
nav .on{color:#6ee7f9;text-shadow:0 0 12px rgba(94,234,212,.65)}
nav .orb{border:2px solid rgba(195,215,255,.55);background:radial-gradient(circle at 32% 28%,#d9fbff,#7ad7ff 30%,#7c83ff 62%,#b07cff);box-shadow:0 0 30px rgba(150,120,255,.8),inset 0 0 12px rgba(255,255,255,.55)}
.bub.me{background:linear-gradient(135deg,#22d3ee,#6d8cff 60%,#a78bfa)}
.sheet{z-index:60}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,28,69,.96);border:1px solid rgba(140,180,255,.45);color:#fff;padding:10px 16px;border-radius:99px;z-index:70;font-size:14px;max-width:86%;text-align:center}
</style>
</head>
<body>
<header class="row"><div>TinVin <span>Social</span></div><span class="sp"></span><button class="ic hidden" id="gear" aria-label="Settings" style="font-size:22px">&#9881;</button></header>
<div class="wrap">

<div id="auth" class="card hidden">
  <h2 id="aT">Welcome back</h2>
  <input id="aE" type="email" placeholder="Email" autocomplete="email">
  <input id="aU" placeholder="Username (letters, numbers, _)" class="hidden">
  <div style="position:relative"><input id="aP" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" style="padding-right:46px"><button type="button" class="ic" id="aEye" aria-label="Show password" style="position:absolute;right:4px;top:9px;color:var(--mut);display:flex;line-height:0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></div>
  <button class="btn" id="aB" style="width:100%">Login</button>
  <div class="err" id="aM"></div>
  <p class="mut" style="text-align:center"><span id="aF" style="color:var(--ac);cursor:pointer">Forgot password?</span></p>
  <p class="mut" style="text-align:center"><span id="aS" style="color:var(--ac);cursor:pointer">Create account</span></p>
</div>

<div id="app" class="hidden"><div id="view"></div></div>
</div>

<nav id="nav" class="hidden">
  <button data-v="home" class="on"><span>Home</span></button>
  <button data-v="search"><span>Search</span></button>
  <button data-v="create" class="orb" aria-label="Create">+</button>
  <button data-v="chats"><span>Chats</span><i id="cb" class="bd hidden"></i></button>
  <button data-v="me"><span>Profile</span></button>
</nav>
<div id="sheet" class="sheet hidden"></div>

<script>
"use strict";
const API="https://tinvin-social-api.aslan89aslan1.workers.dev";
let token=localStorage.getItem("tvs_token")||"",me=null,mode="login",tab=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vb=v=>v?' <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle"><path fill="#1d9bf0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91C2.88 9.33 2 10.57 2 12s.88 2.67 2.19 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/><path fill="#fff" d="M9.5 16.5l-3.5-3.5 1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></svg>':"";
const ago=t=>{const s=Math.floor(Date.now()/1000)-t;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};

async function api(path,opt={}){
  const h={...(opt.headers||{})};
  if(!(opt.raw))h["Content-Type"]="application/json";
  if(token)h.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...opt,headers:h});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token){logout(true)}throw new Error(d.error||"Request failed.")}
  return d;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

/* DIALOGS */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
window.alert=m=>toast(m);
function sure(msg,ok="Yes"){
  return new Promise(res=>{
    const s=$("sheet");s.classList.remove("hidden");
    s.innerHTML=`<div><p style="margin:6px 0 10px">${esc(msg)}</p><button class="btn" id="dY">${esc(ok)}</button><button id="dN">Cancel</button></div>`;
    const done=v=>{s.classList.add("hidden");res(v)};
    s.onclick=e=>{if(e.target===s)done(false)};
    $("dY").onclick=()=>done(true);$("dN").onclick=()=>done(false);
  });
}
function ask(msg,val=""){
  return new Promise(res=>{
    const s=$("sheet");s.classList.remove("hidden");
    s.innerHTML=`<div><p style="margin:6px 0">${esc(msg)}</p><input id="dI" value="${esc(val)}" autocomplete="off"><button class="btn" id="dY">Save</button><button id="dN">Cancel</button></div>`;
    const done=v=>{s.classList.add("hidden");res(v)};
    s.onclick=e=>{if(e.target===s)done(null)};
    $("dY").onclick=()=>done($("dI").value);$("dN").onclick=()=>done(null);
    setTimeout(()=>$("dI").focus(),60);
  });
}

/* AUTH */
$("aS").onclick=()=>{mode=mode==="login"?"signup":"login";
  $("aT").textContent=mode==="login"?"Welcome back":"Create account";
  $("aB").textContent=mode==="login"?"Login":"Sign up";
  $("aS").textContent=mode==="login"?"Create account":"I have an account";
  $("aU").classList.toggle("hidden",mode==="login");$("aF").classList.toggle("hidden",mode!=="login");$("aM").textContent=""};
$("aB").onclick=async()=>{
  $("aM").textContent="";$("aM").style.color="";
  if(mode==="reset"){try{await post("/api/reset",{token:resetTok,password:$("aP").value});alert("Password changed. Please log in.");history.replaceState(null,"",location.pathname);setTimeout(()=>location.reload(),1300)}catch(e){$("aM").textContent=e.message}return}
  try{
    const d=await post("/api/"+mode,{email:$("aE").value,username:$("aU").value,password:$("aP").value});
    token=d.token;localStorage.setItem("tvs_token",token);start();
  }catch(e){$("aM").textContent=e.message}
};
let resetTok="";
const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
$("aEye").onclick=()=>{const p=$("aP"),show=p.type==="password";p.type=show?"text":"password";$("aEye").innerHTML=show?EYE:EYEOFF};
$("aF").onclick=async()=>{
  const em=$("aE").value.trim();
  if(!em){$("aM").textContent="Enter your email first.";return}
  try{await post("/api/forgot",{email:em});$("aM").style.color="#22c55e";$("aM").textContent="If this email exists, we sent a reset link."}catch(e){$("aM").textContent=e.message}
};
function resetMode(t){resetTok=t;mode="reset";$("aT").textContent="Set new password";
  ["aE","aU","aF","aS"].forEach(i=>$(i).classList.add("hidden"));
  $("aP").placeholder="New password (8+ characters)";$("aP").autocomplete="new-password";$("aB").textContent="Save password"}
function logout(silent){
  if(!silent&&token)api("/api/logout",{method:"POST"}).catch(()=>{});
  token="";me=null;localStorage.removeItem("tvs_token");
  $("auth").classList.remove("hidden");$("app").classList.add("hidden");$("nav").classList.add("hidden");$("gear").classList.add("hidden");clearInterval(unT);clearInterval(chatT);
}
async function start(){
  try{me=(await api("/api/me")).user}catch{return logout(true)}
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");$("gear").classList.remove("hidden");
  go("home");pollUnread();clearInterval(unT);unT=setInterval(pollUnread,15000);
}

/* NAV */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,arg){
  clearInterval(chatT);$("nav").classList.remove("hidden");
  if(v==="create")return create();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="chats")return chats();
  if(v==="home")return home();
  if(v==="search")return search();
  if(v==="me")return profile(me.username);
  if(v==="user")return profile(arg);
  if(v==="settings")return settings();
}

/* POST CARD */
function card(p,refresh){
  const d=document.createElement("div");d.className="card post";
  d.innerHTML=`<div class="row"><b class="u">@${esc(p.username)}${vb(p.verified)}</b><span class="mut">${ago(p.created_at)}</span><span class="sp"></span><button class="ic" data-m aria-label="More">&#8943;</button></div>
  ${p.text?`<p>${esc(p.text)}</p>`:""}${p.image_key?`<img loading="lazy" src="${API}/img/${p.image_key}" alt="">`:""}
  <div class="row"><button class="ic" data-l>${p.liked?"&#9829;":"&#9825;"} ${p.likes}</button><button class="ic" data-c>Comments ${p.comments}</button><button class="ic" data-s>Share</button></div>
  <div class="cm hidden"></div>`;
  d.querySelector(".u").onclick=()=>go("user",p.username);
  d.querySelector("[data-l]").onclick=async()=>{await post("/api/like/"+p.id);refresh()};
  d.querySelector("[data-s]").onclick=async()=>{
    const data={title:"TinVin Social",text:(p.text||"Post by @"+p.username),url:location.href.split("#")[0]};
    try{navigator.share?await navigator.share(data):(await navigator.clipboard.writeText(data.url),alert("Link copied"))}catch{}
  };
  const cm=d.querySelector(".cm");
  d.querySelector("[data-c]").onclick=()=>{cm.classList.toggle("hidden");if(!cm.classList.contains("hidden"))comments(p.id,cm,refresh)};
  d.querySelector("[data-m]").onclick=()=>menu(p,refresh);
  return d;
}
async function comments(id,box,refresh){
  box.innerHTML="Loading...";
  try{
    const c=(await api("/api/comments/"+id)).comments;
    box.innerHTML=c.map(x=>`<div><b>@${esc(x.username)}${vb(x.verified)}</b>${esc(x.text)}</div>`).join("")+
      `<div class="row"><input placeholder="Add a comment" maxlength="300"><button class="btn">Send</button></div>`;
    box.querySelector(".btn").onclick=async()=>{
      const i=box.querySelector("input");if(!i.value.trim())return;
      await post("/api/comments/"+id,{text:i.value});refresh();
    };
  }catch(e){box.textContent=e.message}
}
function menu(p,refresh){
  const s=$("sheet");s.classList.remove("hidden");
  const own=p.uid===me.id;
  s.innerHTML=`<div>${own?`<button class="d" data-a="del">Delete post</button>`:
    `<button data-r="Spam">Report: spam</button><button data-r="Harassment or hate">Report: harassment or hate</button>
     <button data-r="Nudity or violence">Report: nudity or violence</button><button data-r="False information">Report: false information</button>
     <button class="d" data-a="block">Block @${esc(p.username)}</button>`}<button data-a="x">Cancel</button></div>`;
  s.onclick=e=>{if(e.target===s)s.classList.add("hidden")};

let sq="";
function search(){
  $("view").innerHTML=`<div class="card"><input id="sI" placeholder="Search people or posts" maxlength="50" value="${esc(sq)}"></div><div id="sR"></div>`;
  const hint=`<p class="mut">Type at least 2 characters.</p>`;
  const run=async()=>{
    sq=$("sI").value.trim();const box=$("sR");
    if(sq.length<2){box.innerHTML=hint;return}
    box.textContent="Searching...";
    try{
      const d=await api("/api/search?q="+encodeURIComponent(sq));
      box.innerHTML="";
      if(!d.users.length&&!d.posts.length){box.innerHTML=`<p class="mut">No results.</p>`;return}
      if(d.users.length){
        const c=document.createElement("div");c.className="card";
        c.innerHTML=`<b>People</b>`+d.users.map(u=>`<div class="row u" data-n="${esc(u.username)}" style="padding:10px 0;border-top:1px solid var(--line)"><b>@${esc(u.username)}${vb(u.verified)}</b><span class="mut">${esc(u.bio||"")}</span></div>`).join("");
        c.querySelectorAll("[data-n]").forEach(r=>r.onclick=()=>go("user",r.dataset.n));
        box.appendChild(c);
      }
      d.posts.forEach(p=>box.appendChild(card(p,run)));
    }catch(e){box.textContent=e.message}
  };
  let t;$("sI").oninput=()=>{clearTimeout(t);t=setTimeout(run,400)};
  if(sq)run();else $("sR").innerHTML=hint;
}

function viewStories(list,i=0){
  const o=document.createElement("div");o.className="sv";document.body.appendChild(o);
  let t;const close=()=>{clearTimeout(t);o.remove()};
  const show=()=>{
    clearTimeout(t);
    if(i>=list.length)return close();
    if(i<0)i=0;
    const x=list[i];
    o.innerHTML=`<div class="sb">${list.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>
      <div class="sh"><b>@${esc(x.username)}${vb(x.verified)}</b><span class="mut">${ago(x.created_at)}</span><span class="sp"></span>${x.uid===me.id?`<button class="ic" data-d aria-label="Delete" style="color:#f87171;font-weight:700">Delete</button>`:""}<button class="ic" data-x aria-label="Close" style="font-size:20px">&#10005;</button></div>
      <div class="sm">${x.image_key?`<img src="${API}/img/${x.image_key}" alt="">`:""}${x.text?`<p>${esc(x.text)}</p>`:""}</div>
      <div class="st"><i data-p></i><i data-n></i></div>`;
    o.querySelector("[data-x]").onclick=close;
    o.querySelector("[data-p]").onclick=()=>{i--;show()};
    o.querySelector("[data-n]").onclick=()=>{i++;show()};
    const dl=o.querySelector("[data-d]");
    if(dl)dl.onclick=async()=>{clearTimeout(t);if(!await sure("Delete this story?","Delete")){show();return}try{await api("/api/story/"+x.id,{method:"DELETE"});close();go("home")}catch(e){alert(e.message)}};
    t=setTimeout(()=>{i++;show()},7000);
  };
  show();
}

async function chat(id,name){
  clearInterval(chatT);$("nav").classList.add("hidden");
  $("view").innerHTML=`<div class="glass" style="padding:10px 14px"><div class="row"><button class="ic" id="cBk" style="font-size:24px" aria-label="Back">&lsaquo;</button><b>@${esc(name)}</b></div></div><div class="msgs" id="msgs"></div><div class="cbar"><input id="mI" maxlength="1000" placeholder="Message..." autocomplete="off"><button class="btn" id="mS">Send</button></div>`;
  let sig="";
  const del=x=>{
    const s=$("sheet");s.classList.remove("hidden");
    s.innerHTML=`<div><button class="d" id="dm">Delete message</button><button id="dc">Cancel</button></div>`;
    s.onclick=e=>{if(e.target===s)s.classList.add("hidden")};
    $("dc").onclick=()=>s.classList.add("hidden");
    $("dm").onclick=async()=>{s.classList.add("hidden");try{await api("/api/message/"+x.id,{method:"DELETE"});sig="";draw()}catch(e){alert(e.message)}};
  };
  const draw=async()=>{
    const box=$("msgs");if(!box)return clearInterval(chatT);
    try{
      const m=(await api("/api/messages/"+id+"?after=0")).messages,g=m.map(x=>x.id).join();
      if(g===sig)return;
      sig=g;box.innerHTML="";
      m.forEach(x=>{const d=document.createElement("div");d.className="bub "+(x.from_id===me.id?"me":"th");d.textContent=x.text;if(x.from_id===me.id)d.onclick=()=>del(x);box.appendChild(d)});
      window.scrollTo(0,document.body.scrollHeight);
    }catch{}
  };
  const send=async()=>{const i=$("mI"),t=i.value.trim();if(!t)return;i.value="";try{await post("/api/message/"+id,{text:t});draw()}catch(e){alert(e.message);i.value=t}};
  $("cBk").onclick=()=>go("chats");
  $("mS").onclick=send;$("mI").onkeydown=e=>{if(e.key==="Enter")send()};
  await draw();chatT=setInterval(draw,3500);pollUnread();
}

  $("view").innerHTML=`<div dir="${dir}">
  <div class="glass" style="text-align:center"><div class="ava">${esc((me.username||"?")[0].toUpperCase())}</div>
    <b style="font-size:18px">@${esc(me.username)}${vb(me.verified)}</b><p class="mut" style="margin:4px 0 12px">${esc(me.email)}</p></div>
  <div class="glass"><h4>${T("Account")}</h4>
    ${R("sN","user","Change name")}
    ${R("sE","mail","Change email")}
    <div id="pE" class="spanel hidden"><input id="eN" type="email" placeholder="${T("New email")}" autocomplete="email"><input id="eP" type="password" placeholder="${T("Password")}" autocomplete="current-password"><button class="btn" id="eS">${T("Save")}</button><div class="err" id="eM"></div></div>
    ${R("sP","lock","Change password")}
    <div id="pf" class="spanel hidden"><input id="pC" type="password" placeholder="${T("Current password")}" autocomplete="current-password"><input id="pN" type="password" placeholder="${T("New password (8+ characters)")}" autocomplete="new-password"><button class="btn" id="pS">${T("Save")}</button><div class="err" id="pM2"></div></div>
    ${R("sL","globe","Language")}
    <div id="pL" class="spanel hidden">${Object.entries(LANGS).map(([k,v])=>`<button class="btn ${k===lang?"":"ghost"}" data-lg="${k}" style="margin:3px">${v}</button>`).join("")}</div>
  </div>
  <div class="glass"><h4>${T("Security")}</h4>
    ${R("s2","shield","Two-factor authentication",`<span class="pill">${T("Soon")}</span>`)}
    ${R("sA","devices","Log out of all devices")}
    ${R("sK","block","Blocked accounts")}
    <div id="pK" class="spanel hidden"><div id="bl" class="mut">...</div></div>
  </div>
  <div class="glass"><h4>${T("About")}</h4>${LK("privacy.html","Privacy policy")}${LK("terms.html","Terms and community rules")}</div>
  <div class="glass">${R("lo","out","Logout")}${R("del","trash","Delete account","","d")}</div></div>`;
  const tg=(b,p)=>{$(b).onclick=()=>$(p).classList.toggle("hidden")};
  tg("sE","pE");tg("sP","pf");tg("sL","pL");
  $("sN").onclick=async()=>{const n=await ask("New username (3-20 letters, numbers, _)",me.username);if(n===null||n.trim()===me.username)return;try{await post("/api/me",{username:n});me.username=n.trim();settings()}catch(e){alert(e.message)}};
  $("eS").onclick=async()=>{const m=$("eM");m.style.color="";m.textContent="";try{const r=await post("/api/email",{email:$("eN").value,password:$("eP").value});me.email=r.email;settings()}catch(e){m.textContent=e.message}};
  $("pS").onclick=async()=>{const m=$("pM2");m.style.color="";m.textContent="";try{await post("/api/password",{current:$("pC").value,password:$("pN").value});m.style.color="#22c55e";m.textContent="OK";$("pC").value="";$("pN").value=""}catch(e){m.textContent=e.message}};
  document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{lang=b.dataset.lg;localStorage.setItem("tvs_lang",lang);applyLang();settings()});
  $("s2").onclick=()=>alert("Two-factor authentication is coming soon.");
  $("sA").onclick=async()=>{if(!await sure("Log out of all devices, including this one?","Log out"))return;try{await post("/api/logout-all");logout(true)}catch(e){alert(e.message)}};
  const loadBlocks=async()=>{const box=$("bl");
    try{const l=(await api("/api/blocks")).users;
      if(!l.length){box.textContent=T("No blocked accounts.");return}
      box.innerHTML="";
      l.forEach(u=>{const r=document.createElement("div");r.className="row";r.style.padding="6px 0";
        r.innerHTML=`<b style="color:var(--fg)">@${esc(u.username)}</b><span class="sp"></span><button class="btn ghost">${T("Unblock")}</button>`;
        r.querySelector("button").onclick=async()=>{try{await post("/api/unblock/"+u.id);loadBlocks()}catch(e){alert(e.message)}};
        box.appendChild(r)});
    }catch(e){box.textContent=e.message}};
  $("sK").onclick=()=>{$("pK").classList.toggle("hidden");loadBlocks()};
  $("lo").onclick=()=>logout();
  $("del").onclick=async()=>{
    if(!await sure("Delete your account and all your content? This can't be undone.","Delete account"))return;
    try{await api("/api/me",{method:"DELETE"});logout(true)}catch(e){alert(e.message)}
  };
}

applyLang();
const rt=(location.hash.match(/^#reset=(r_[a-f0-9]+)/)||[])[1];
if(rt){logout(true);resetMode(rt)}else token?start():logout(true);
</script>
</body>
</html>
