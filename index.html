<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TinVin</title>
  <style>
    :root {
      --bg-1: #090d16;
      --bg-2: #141026;
      --card: rgba(20, 26, 46, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --gold: #f5b942;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(245, 185, 66, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.16), transparent 45%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      text-align: center;
      color: var(--gold);
      font-size: 1.6rem;
      margin-bottom: 18px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--gold), #d99b1e);
      color: #090d16;
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .form.active {
      display: flex;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.7);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
    }

    .submit-btn {
      margin-top: 4px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), #16a34a);
      color: #051109;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 0.88rem;
      cursor: pointer;
      text-align: right;
      padding: 2px 0;
    }

    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      display: none;
      line-height: 1.5;
    }

    .msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }

    .session-box {
      display: none;
      text-align: center;
      flex-direction: column;
      gap: 12px;
    }

    .session-box.active {
      display: flex;
    }

    .logout-btn {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TinVin</h1>

    <div id="authSection">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="loginTab" onclick="switchView('login')">Login</button>
        <button type="button" class="tab-btn" id="signupTab" onclick="switchView('signup')">Signup</button>
      </div>

      <form id="loginForm" class="form active" onsubmit="handleAuth(event, '/login')">
        <input type="email" name="email" placeholder="ئیمەیڵ" required />
        <input type="password" name="password" placeholder="پاسۆرد" required />
        <button type="button" class="link-btn" onclick="switchView('forgot')">پاسۆردت بیرچووە؟ (Forget Password)</button>
        <button type="submit" class="submit-btn">چوونەژوورەوە</button>
      </form>

      <form id="signupForm" class="form" onsubmit="handleAuth(event, '/signup')">
        <input type="text" name="username" placeholder="ناوی بەکارهێنەر (Username)" required />
        <input type="email" name="email" placeholder="ئیمەیڵ" required />
        <input type="password" name="password" placeholder="پاسۆرد" minlength="6" required />
        <button type="submit" class="submit-btn">دروستکردنی هەژمار</button>
      </form>

      <form id="forgotForm" class="form" onsubmit="handleAuth(event, '/forgot-password')">
        <input type="email" name="email" placeholder="ئیمەیڵی هەژمارەکەت بنووسە" required />
        <button type="submit" class="submit-btn">ناردنی داواکاری گەڕاندنەوە</button>
        <button type="button" class="link-btn" onclick="switchView('login')">گەڕانەوە بۆ Login</button>
      </form>
    </div>

    <div id="sessionBox" class="session-box">
      <p id="sessionInfo"></p>
      <button type="button" class="logout-btn" onclick="logout()">چوونەدەرەوە</button>
    </div>

    <div id="statusMsg" class="msg"></div>
  </div>

  <script>
    const WORKER_URL = "https://your-tinvin-worker.workers.dev";
    const STORAGE_KEY = "tinvin_auth_session";

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const forgotForm = document.getElementById("forgotForm");
    const authSection = document.getElementById("authSection");
    const sessionBox = document.getElementById("sessionBox");
    const sessionInfo = document.getElementById("sessionInfo");
    const statusMsg = document.getElementById("statusMsg");

    function showMessage(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = "msg " + type;
    }

    function clearMessage() {
      statusMsg.textContent = "";
      statusMsg.className = "msg";
    }

    function switchView(view) {
      clearMessage();
      loginForm.classList.remove("active");
      signupForm.classList.remove("active");
      forgotForm.classList.remove("active");
      loginTab.classList.remove("active");
      signupTab.classList.remove("active");

      if (view === "login") {
        loginForm.classList.add("active");
        loginTab.classList.add("active");
      } else if (view === "signup") {
        signupForm.classList.add("active");
        signupTab.classList.add("active");
      } else if (view === "forgot") {
        forgotForm.classList.add("active");
      }
    }

    function renderSession() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        authSection.style.display = "block";
        sessionBox.classList.remove("active");
        return;
      }
      try {
        const data = JSON.parse(raw);
        const label = data.username || data.email || "بەکارهێنەر";
        sessionInfo.textContent = "چوویتە ژوورەوە وەک: " + label;
        authSection.style.display = "none";
        sessionBox.classList.add("active");
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEY);
      clearMessage();
      renderSession();
      switchView("login");
    }

    async function handleAuth(event, endpoint) {
      event.preventDefault();
      clearMessage();

      const form = event.target;
      const btn = form.querySelector(".submit-btn");
      const payload = Object.fromEntries(new FormData(form).entries());

      btn.disabled = true;
      try {
        const res = await fetch(WORKER_URL + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage(data.error || data.message || "هەڵەیەک ڕوویدا.", "error");
          return;
        }

        if (endpoint === "/login" || endpoint === "/signup") {
          const sessionData = {
            token: data.token || null,
            email: data.email || payload.email,
            username: data.username || payload.username || null
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
          showMessage(data.message || "بە سەرکەوتوویی چوویتە ژوورەوە.", "success");
          renderSession();
        } else {
          showMessage(
            data.message || "داواکاری گەڕاندنەوەی پاسۆرد نێردرا؛ ئیمەیڵەکەت بپشکنە.",
            "success"
          );
          form.reset();
        }
      } catch {
        showMessage("پەیوەندی بە Workerەکە سەرکەوتوو نەبوو.", "error");
      } finally {
        btn.disabled = false;
      }
    }

    renderSession();
  </script>
</body>
</html>
